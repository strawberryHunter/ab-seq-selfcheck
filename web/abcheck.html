<title>AbCheck 항체 서열 점검</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: an app shell in the Nextmove family — a fixed left sidebar (brand, primary
   action, grouped navigation with counts, recent analyses), a sticky top bar (search,
   theme), one screen at a time, and detail in a sheet from the right. Risk is always
   written as text and never painted: the tool gives no verdicts. */
:root {
  --paper: #ffffff;
  --card: #ffffff;
  --surf: #f5f7fb;
  --line: #e2e7f0;
  --line2: #eef2f8;
  --ink: #0d1526;
  --body: #3a4560;
  --muted: #667089;
  --brand: #2563eb;
  --brand-soft: #e4ecfd;
  --brand-ink: #1b4ed8;
  --sbg: #f5f7fb;
  --sbg2: #e6edfb;
  --cdr: #dce7fd;
  --scrim: rgba(10, 13, 18, 0.45);
  --vh: #2a78d6;
  --vl: #eb6834;
  --ff: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  --fm: "IBM Plex Mono", "D2Coding", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #080c15; --card: #0f1626; --surf: #141c2e; --line: #22304f; --line2: #19233a;
    --ink: #eef2fa; --body: #b4bfd6; --muted: #8f9ab3; --brand: #6ea0ff; --brand-soft: #15213c;
    --brand-ink: #9dbcff; --sbg: #0b111d; --sbg2: #16213b; --cdr: #1d2f55; --scrim: rgba(0, 0, 0, 0.6);
    --vh: #3987e5; --vl: #d95926; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #080c15; --card: #0f1626; --surf: #141c2e; --line: #22304f; --line2: #19233a;
  --ink: #eef2fa; --body: #b4bfd6; --muted: #8f9ab3; --brand: #6ea0ff; --brand-soft: #15213c;
  --brand-ink: #9dbcff; --sbg: #0b111d; --sbg2: #16213b; --cdr: #1d2f55; --scrim: rgba(0, 0, 0, 0.6);
  --vh: #3987e5; --vl: #d95926; color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: var(--ff); font-size: 15px; line-height: 1.6;
  word-break: keep-all; -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--paper); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--brand-ink); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3, h4 { margin: 0; line-height: 1.3; text-wrap: balance; }
p { margin: 0; }
.mono { font-family: var(--fm); font-size: 0.92em; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: 256px minmax(0, 1fr); min-height: 100vh; }
.side {
  position: sticky; top: env(safe-area-inset-top, 0px); align-self: start;
  height: calc(100vh - env(safe-area-inset-top, 0px)); overflow: auto;
  background: var(--sbg); border-right: 1px solid var(--line2);
  padding: 22px 12px 22px; padding-left: max(12px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 14px;
}
.brand { display: flex; align-items: center; gap: 11px; padding: 0 8px 4px; text-decoration: none; color: var(--ink); }
.brand svg { flex: none; }
.bname { display: grid; gap: 1px; }
.bname b { font-family: var(--fm); font-size: 19px; font-weight: 600; letter-spacing: -0.4px; line-height: 1.15; }
.bname b span { color: var(--brand); }
.bname small { font-size: 12px; color: var(--muted); }
.cta {
  display: block; text-align: center; text-decoration: none; font-weight: 700; font-size: 15px;
  padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--brand-ink);
}
.cta:hover { border-color: var(--brand); }
.cta[aria-current="page"] { background: var(--brand); border-color: var(--brand); color: #fff; }
.ngroup { display: grid; gap: 1px; }
.slabel { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: 0.6px; padding: 12px 12px 6px; border-top: 1px solid var(--line); }
.nav {
  position: relative; display: flex; align-items: center; gap: 8px; text-decoration: none;
  padding: 8px 10px 8px 12px; border-radius: 9px; font-size: 15px; font-weight: 600; color: var(--body);
}
.nav b { margin-left: auto; font-size: 13px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.nav:hover { background: var(--sbg2); color: var(--ink); }
.nav[aria-current="page"] { background: var(--sbg2); color: var(--ink); font-weight: 700; }
.nav[aria-current="page"]::before { content: ""; position: absolute; left: 0; top: 7px; bottom: 7px; width: 2px; background: var(--brand); }
.nav[aria-current="page"] b { color: var(--brand-ink); }
.nav.zero b { opacity: 0.5; }
.recent { display: grid; gap: 2px; }
.rec { display: grid; gap: 1px; text-align: left; border: none; background: none; padding: 7px 10px 7px 12px; border-radius: 9px; color: var(--body); }
.rec:hover { background: var(--sbg2); color: var(--ink); }
.rec span { font-size: 13.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rec small { font-size: 12px; color: var(--muted); }
.linkbtn { border: none; background: none; padding: 4px 12px; color: var(--muted); font-size: 12.5px; text-align: left; text-decoration: underline; text-underline-offset: 3px; }
.sfoot { margin-top: auto; padding: 12px 12px 0; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--muted); display: grid; gap: 4px; }

.mainwrap { min-width: 0; display: flex; flex-direction: column; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--paper); border-bottom: 1px solid var(--line); }
.inner {
  max-width: 1280px; width: 100%; margin: 0 auto;
  padding-left: max(24px, env(safe-area-inset-left, 0px));
  padding-right: max(24px, env(safe-area-inset-right, 0px));
}
.topin { display: flex; align-items: center; gap: 10px; padding-block: 11px; }
.search { flex: 1; min-width: 0; position: relative; }
.search svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.search input { width: 100%; border: 1px solid var(--line); background: var(--surf); border-radius: 10px; padding: 9px 36px 9px 38px; outline: none; }
.search input:focus { border-color: var(--ink); background: var(--card); }
.search .clear { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); border: none; background: none; color: var(--muted); font-size: 18px; width: 28px; height: 28px; border-radius: 6px; }
.iconbtn { flex: none; width: 40px; height: 40px; display: grid; place-items: center; border: 1px solid var(--line); background: var(--card); border-radius: 10px; color: var(--ink); }
.iconbtn:hover { border-color: var(--ink); }
main { padding-block: 26px 72px; }

/* ---------- common pieces ---------- */
.bar { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.bar h2 { font-size: 24px; font-weight: 700; letter-spacing: -0.6px; }
.bar .cnt { font-weight: 600; color: var(--muted); }
.sub { color: var(--body); margin-top: 6px; max-width: 70ch; }
.stats { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 0; margin-top: 14px; font-size: 14px; color: var(--body); }
.stats > * { padding: 0 14px; border-left: 1px solid var(--line); }
.stats > *:first-child { padding-left: 0; border-left: none; }
.stats a { color: var(--body); text-decoration: none; }
.stats a:hover { color: var(--brand-ink); text-decoration: underline; }
.stats b { color: var(--ink); font-variant-numeric: tabular-nums; margin-left: 4px; }
.note {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 16px;
  background: var(--brand-soft); color: var(--brand-ink); border-radius: 12px; padding: 11px 15px; font-size: 14px; font-weight: 600;
}
.note .btn { margin-left: auto; }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 18px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.toolbar .spacer { margin-left: auto; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { border: none; background: var(--card); padding: 7px 14px; font-weight: 600; font-size: 14px; color: var(--body); border-left: 1px solid var(--line); }
.seg button:first-child { border-left: none; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.seg button:disabled { color: var(--muted); opacity: 0.5; cursor: default; }
.seg button b { font-weight: 600; opacity: 0.7; margin-left: 4px; font-variant-numeric: tabular-nums; }
select { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 7px 10px; font-weight: 600; font-size: 14px; color: var(--body); }
.btn { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 8px 14px; font-weight: 700; font-size: 14px; color: var(--ink); white-space: nowrap; text-decoration: none; display: inline-block; }
.btn:hover { border-color: var(--ink); }
.btn.fill { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn.fill:hover { filter: brightness(1.08); }
.btn:disabled { opacity: 0.45; cursor: default; }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; min-width: 0; }
.blank { border: 1px dashed var(--line); border-radius: 14px; padding: 42px 20px; text-align: center; color: var(--body); margin-top: 14px; }
.blank b { display: block; font-size: 17px; color: var(--ink); margin-bottom: 4px; }
.foot { margin-top: 18px; font-size: 13px; color: var(--muted); max-width: 90ch; display: grid; gap: 4px; }
.sect { margin-top: 30px; display: grid; gap: 12px; }
.sect > h3 { font-size: 17px; font-weight: 700; letter-spacing: -0.3px; }

/* status tags: three states told apart by fill and border style, never by color */
.tag { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: 12.5px; font-weight: 700; white-space: nowrap; border: 1px solid var(--ink); color: var(--ink); }
.tag.review { background: var(--ink); color: var(--paper); }
.tag.unknown { border-style: dashed; }
.tag.clear { border-color: var(--line); color: var(--muted); font-weight: 600; }
.chain { display: inline-block; font-family: var(--fm); font-size: 11.5px; font-weight: 600; color: var(--muted); border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; margin-left: 6px; vertical-align: 1px; }

/* tables */
.scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; min-width: 0; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th { text-align: left; font-size: 12.5px; font-weight: 700; color: var(--muted); padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px 12px; border-bottom: 1px solid var(--line2); vertical-align: top; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
td.nowrap { white-space: nowrap; }
table.list tbody tr { cursor: pointer; }
table.list tbody tr:hover { background: var(--surf); }
.rowlink { border: none; background: none; padding: 0; font-family: var(--fm); font-weight: 600; font-size: 14px; color: var(--ink); text-align: left; white-space: nowrap; }
.rowlink:hover { color: var(--brand-ink); text-decoration: underline; text-underline-offset: 3px; }
.seqcell { font-family: var(--fm); font-size: 13.5px; white-space: nowrap; }
.seqcell small { font-family: var(--ff); color: var(--muted); margin-left: 6px; font-size: 12px; }
.seqcell u, .ruler u { text-decoration: underline 2px; text-underline-offset: 3px; text-decoration-color: var(--ink); cursor: help; }
.more { margin-top: 12px; }

/* sheet */
.scrim { position: fixed; inset: 0; background: var(--scrim); opacity: 0; pointer-events: none; transition: opacity 0.16s; z-index: 50; }
.scrim.on { opacity: 1; pointer-events: auto; }
#sheet {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(680px, 100vw); z-index: 51;
  background: var(--card); display: flex; flex-direction: column;
  transform: translateX(101%); visibility: hidden; transition: transform 0.2s ease, visibility 0s linear 0.2s;
  box-shadow: -10px 0 40px rgba(10, 13, 18, 0.18);
}
#sheet.on { transform: none; visibility: visible; transition: transform 0.2s ease; }
.sh { display: flex; gap: 12px; align-items: flex-start; padding: 18px 22px 14px; padding-top: calc(18px + env(safe-area-inset-top, 0px)); padding-right: max(22px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); }
.sh h3 { font-family: var(--fm); font-size: 20px; font-weight: 600; letter-spacing: -0.4px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.sh p { margin-top: 4px; color: var(--muted); font-size: 14px; }
.sh .x { margin-left: auto; flex: none; border: none; background: var(--surf); border-radius: 9px; width: 34px; height: 34px; font-size: 20px; line-height: 1; color: var(--body); }
.sb { flex: 1; overflow: auto; padding: 6px 22px 28px; padding-right: max(22px, env(safe-area-inset-right, 0px)); }
.sf { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; border-top: 1px solid var(--line); padding: 11px 22px; padding-bottom: calc(11px + env(safe-area-inset-bottom, 0px)); padding-right: max(22px, env(safe-area-inset-right, 0px)); }
.sf .pos { margin-right: auto; font-size: 13px; color: var(--muted); }
.blk { margin-top: 22px; display: grid; gap: 8px; min-width: 0; }
.blk h4 { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: 0.3px; }
.blk ul { margin: 0; padding-left: 18px; display: grid; gap: 5px; font-size: 14.5px; }
.callout { border-left: 3px solid var(--ink); padding: 2px 0 2px 14px; display: grid; gap: 6px; font-size: 14.5px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12.5px; color: var(--muted); }
.legend .c { background: var(--cdr); font-family: var(--fm); font-weight: 600; padding: 0 4px; border-radius: 3px; color: var(--ink); }
.legend u { font-family: var(--fm); text-decoration: underline 2px; text-underline-offset: 3px; color: var(--ink); }
.ruler { margin: 0; font-family: var(--fm); font-size: 13px; line-height: 1.75; white-space: pre; color: var(--ink); }
.ruler .p { color: var(--muted); user-select: none; }
.ruler .c { background: var(--cdr); font-weight: 600; }
.ruler .l { color: var(--muted); font-family: var(--ff); font-size: 12px; }
.hit td:first-child { font-weight: 700; white-space: nowrap; }
.hit .why { display: block; margin-top: 3px; font-size: 12.5px; color: var(--muted); }

/* new analysis */
textarea {
  width: 100%; min-height: 260px; resize: vertical; padding: 14px;
  font-family: var(--fm); font-size: 13px; line-height: 1.55;
  background: var(--surf); color: var(--ink); border: 1px solid var(--line); border-radius: 12px;
}
textarea:focus { outline: none; border-color: var(--ink); background: var(--card); }
textarea.drag { border-style: dashed; border-color: var(--brand); }
textarea[aria-invalid="true"] { border-color: var(--ink); border-width: 2px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.filebtn { position: relative; }
.filebtn input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.ph { display: inline-flex; gap: 6px; align-items: center; font-size: 14px; font-weight: 600; color: var(--body); margin-left: auto; }
.ph input { width: 4.6em; border: 1px solid var(--line); background: var(--card); border-radius: 9px; padding: 7px 9px; }
.detect { font-size: 13.5px; color: var(--muted); min-height: 1.4em; }
.hints { margin: 0; padding-left: 18px; font-size: 13.5px; color: var(--body); display: grid; gap: 3px; }
kbd { font-family: var(--fm); font-size: 0.85em; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: var(--card); }
.errbox { border-left: 3px solid var(--ink); padding: 4px 0 4px 14px; display: grid; gap: 8px; }
.errbox ul { margin: 0; padding-left: 18px; font-size: 14px; }

/* tiles, steps, figure */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; margin-top: 18px; }
.tile { background: var(--card); padding: 16px 18px; display: grid; gap: 6px; align-content: start; }
.tile b { font-size: 28px; font-weight: 700; letter-spacing: -1px; line-height: 1.05; font-variant-numeric: tabular-nums; }
.tile span { font-size: 13.5px; font-weight: 600; color: var(--body); }
.tile i { font-style: normal; font-size: 12.5px; color: var(--muted); }
.steps { list-style: none; counter-reset: s; padding: 0; margin: 0; display: grid; gap: 14px; }
.steps li { counter-increment: s; position: relative; padding-left: 42px; }
.steps li::before { content: counter(s); position: absolute; left: 0; top: 0; width: 28px; height: 28px; border-radius: 9px; background: var(--brand-soft); color: var(--brand-ink); font-weight: 800; font-size: 13.5px; display: grid; place-items: center; }
.steps b { display: block; font-size: 15.5px; }
.steps p { color: var(--body); font-size: 14px; margin-top: 2px; }
.figure { position: relative; margin-top: 16px; }
.figure svg { display: block; width: 100%; height: auto; overflow: visible; }
.figure .grid line { stroke: var(--line2); stroke-width: 1; }
.figure .axis line { stroke: var(--line); }
.figure text { fill: var(--muted); font-size: 12px; font-family: var(--ff); }
.figure text.lab { fill: var(--body); font-family: var(--fm); font-size: 11.5px; }
.figure text.ttl { fill: var(--body); font-weight: 600; font-size: 12.5px; }
.figure .pt { cursor: pointer; outline: none; }
.figure .pt .hitarea { fill: transparent; }
.figure .pt .mark-h { fill: var(--vh); stroke: var(--card); stroke-width: 2; }
.figure .pt .mark-l { fill: var(--vl); stroke: var(--card); stroke-width: 2; }
.figure .pt:hover .mark-h, .figure .pt:hover .mark-l, .figure .pt:focus-visible .mark-h, .figure .pt:focus-visible .mark-l { stroke: var(--ink); }
.tip { position: absolute; pointer-events: none; z-index: 5; background: var(--ink); color: var(--paper); border-radius: 9px; padding: 8px 11px; font-size: 12.5px; line-height: 1.5; white-space: nowrap; transform: translate(-50%, calc(-100% - 12px)); }
.tip b { font-family: var(--fm); }
.key { display: inline-flex; align-items: center; gap: 6px; }
.key svg { display: block; }

.toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 12px); z-index: 90;
  background: var(--ink); color: var(--paper); border-radius: 12px; padding: 11px 16px; font-size: 14px; font-weight: 600;
  opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s; max-width: calc(100vw - 32px);
}
.toast.on { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side {
    position: static; height: auto; border-right: none; border-bottom: 1px solid var(--line);
    padding: 14px 0 12px; gap: 10px;
  }
  .side > .brand, .side > .cta { margin-left: max(16px, env(safe-area-inset-left, 0px)); margin-right: max(16px, env(safe-area-inset-right, 0px)); }
  .brand { padding: 0; }
  .navs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .navs::-webkit-scrollbar { display: none; }
  .ngroup { display: contents; }
  .slabel, .recent, .sfoot, .recgroup { display: none; }
  .nav { flex: none; white-space: nowrap; border: 1px solid var(--line); border-radius: 999px; padding: 6px 13px; font-size: 14px; background: var(--card); }
  .nav[aria-current="page"]::before { display: none; }
  .nav[aria-current="page"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .nav[aria-current="page"] b { color: var(--paper); }
  .inner { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  main { padding-block: 20px 60px; }
  .bar h2 { font-size: 21px; }
  .ph { margin-left: 0; }
}
@media (max-width: 640px) {
  #sheet { top: auto; height: 92vh; width: 100vw; border-radius: 18px 18px 0 0; transform: translateY(101%); }
  #sheet.on { transform: none; }
  .sh { padding-top: 16px; }
  .stats > * { padding: 0 10px; }
}
@media (prefers-reduced-motion: reduce) {
  #sheet, .scrim, .toast { transition: none; }
}
</style>

<div class="app">
  <aside class="side" aria-label="메뉴">
    <a class="brand" href="#all" aria-label="AbCheck 후보 전체로">

 *
 * A line-by-line port of the Python package `abcheck/` so the tool can run in a browser.

 *     json.loads(abcheck.render.as_json(abcheck.report.build_many(entries, ph)))

 * input parsing. scripts/js_parity.py checks all of this against Python.

(function (root, factory) {

    } else if (decpt >= digits.length) {

  // exact but breaks exact ties away from zero, so ties are detected and fixed here.

  function finditer(re, s, pos) {

  function search(re, s, pos) {

  // ==========================================================================
  // abcheck/__init__.py
  // ==========================================================================

  var VERSION = "0.1.0";

  var LIMITATION_NOTICE = [
    "이 도구는 보존 잔기 앵커 기반 스크리닝 휴리스틱이다. ANARCI/IMGT 같은 numbering 엔진이 아니다.",
    "CDR 경계는 Kabat 을 근사한 것이며, 번호를 매기지 않는다. 삽입/결실이 있는 서열에서는 경계가 밀릴 수 있다.",
    "liability 플래그는 서열 모티프만 본다. 구조적 노출도(용매 접근성)를 보지 않으므로 실제 위험도는 다를 수 있다.",
    "pI/GRAVY/net charge 는 서열 기반 추정치다. 실측값과 다를 수 있다.",
    "다음 경우에는 ANARCI/IMGT 로 반드시 재확인할 것: " +
    "confident=False 인 서열, CDR 길이가 통상 범위를 벗어난 서열, " +
    "비(非)항체 또는 비정형 스캐폴드(나노바디·scFv·이중특이체 링커 포함)로 의심되는 서열, " +

  ];

  var NO_VERDICT_NOTICE =
    "이 도구는 '개발 가능성 높음/낮음' 같은 종합 판정을 내리지 않는다. " +
    "플래그와 그 근거만 제시한다. 판단은 사람이 한다.";

  // ==========================================================================
  // abcheck/validate.py
  // ==========================================================================

  var STANDARD_AA = "ACDEFGHIKLMNPQRSTVWY";
  var AMBIGUOUS_AA = {
    X: "불특정 잔기",
    B: "Asp 또는 Asn",
    Z: "Glu 또는 Gln",
    J: "Leu 또는 Ile",
    U: "셀레노시스테인",
    O: "피롤리신"
  };

  var NUCLEOTIDE_MIN_LENGTH = 30;
  var NUCLEOTIDE_MIN_DISTINCT = 3;
  var MIN_DOMAIN_LENGTH = 70;
  var MAX_DOMAIN_LENGTH = 200;

  var GAP_CHARS = [".", "-"];
  var EMPTY_MESSAGE = "서열이 비어 있다. 아미노산 한 글자 코드로 붙여넣어라.";

  function isAmbiguous(ch) {

  // validate.validate -- never throws; returns {ok, cleaned, errors, warnings}
  function validate(raw) {
    var errors = [], warnings = [];

      return { ok: false, cleaned: "", errors: [EMPTY_MESSAGE], warnings: [] };
    }
    var text = String(raw);

    // --- FASTA header ---
    var headerLines = pySplitLines(text).map(pyStrip).filter(function (ln) {
      return ln.charAt(0) === ">";
    });
    if (headerLines.length) {
      var sample = codePoints(headerLines[0]).slice(0, 40).join("");
      errors.push(
        "FASTA 헤더가 섞여 있다 (예: '" + sample + "'). " +
        "'>' 로 시작하는 줄을 지우고 아미노산 서열만 남겨라. " +
        "여러 서열을 FASTA 로 넣으려면 파일로 저장한 뒤 파일 경로를 넣으면 된다 " +

    var cleaned = textCps.filter(function (ch) {
      return STRIPPABLE.indexOf(ch) < 0;
    }).join("").toUpperCase();

    if (chars.length !== textCps.length) {
      warnings.push("공백과 줄바꿈은 제거하고 처리했다.");
    }

    // --- alignment gaps ---
    var nGaps = chars.filter(function (ch) { return GAP_CHARS.indexOf(ch) >= 0; }).length;
    if (nGaps && nGaps < chars.length / 2) {
      chars = chars.filter(function (ch) { return GAP_CHARS.indexOf(ch) < 0; });
      cleaned = chars.join("");
      warnings.push("정렬 갭 문자('.', '-') " + nGaps + "개를 제거하고 처리했다.");
    }

      return { ok: false, cleaned: "", errors: [EMPTY_MESSAGE], warnings: [] };
    }

    var bad = [];
    chars.forEach(function (ch, i) {
      if (STANDARD_AA.indexOf(ch) < 0 || ch.length !== 1) bad.push([i + 1, ch]);
    });

          "이 도구는 모호 코드를 추측하지 않는다. 확정된 잔기로 바꿔라."
        );
      }
      if (others.length) {
        var spots = bad.slice(0, 5).filter(function (b) {
          return others.indexOf(b[1]) >= 0;
        }).map(function (b) {
          return b[0] + "번째 '" + b[1] + "'";
        }).join(", ");

          "아미노산이 아닌 문자가 있다: " + others.map(pyReprStr).join(", ") +

        "DNA/RNA 서열로 보인다 (A/C/G/T/U/N 으로만 이뤄진 " + chars.length + " 글자). " +
        "이 도구는 아미노산 서열만 받는다. 번역한 단백질 서열을 넣어라."
      );
      return { ok: false, cleaned: cleaned, errors: errors, warnings: warnings };
    }

    // --- length check ---
    var n = chars.length;
    if (n < MIN_DOMAIN_LENGTH) {
      errors.push(
        "서열이 너무 짧다 (" + n + " 잔기). 가변도메인 하나는 보통 " + MIN_DOMAIN_LENGTH +
        " 잔기 이상이다. " +
        "CDR 조각만 넣은 것이 아닌지 확인하라 — 이 도구는 도메인 전체를 받는다."
      );
    } else if (n > MAX_DOMAIN_LENGTH) {
      errors.push(
        "서열이 너무 길다 (" + n + " 잔기). 이 도구는 VH 또는 VL 도메인 하나만 받는다 " +
        "(허용 범위 " + MIN_DOMAIN_LENGTH + "-" + MAX_DOMAIN_LENGTH + " 잔기). " +
        "scFv·Fab·전장 항체라면 VH 와 VL 을 각각 나눠서 넣어라."
      );
    }

    if (errors.length) {
      return { ok: false, cleaned: cleaned, errors: errors, warnings: warnings };
    }
    return { ok: true, cleaned: cleaned, errors: errors, warnings: warnings };
  }

  var CDR2_OFFSET_H = 14, CDR2_OFFSET_L = 15;
  var CDR3_OFFSET_H = 3, CDR3_OFFSET_L = 1;
  var CDR_L2_LENGTH = 7;
  var FR2_CONTEXT_H = /W[VIA][RKQ]Q/;
  var FR2_CONTEXT_L = /W[YF][QL]Q/;
  var MIN_CDR1_LENGTH_H = 5, MIN_CDR1_LENGTH_L = 7;
  var MIN_CDR_H2_BEFORE_MOTIF = 9;
  var FR3_TO_CYS_GAP = 29;
  var TYPICAL_LENGTHS = {
    "CDR-H1": [5, 7],
    "CDR-H2": [16, 20],
    "CDR-H3": [3, 30],
    "CDR-L1": [7, 17],
    "CDR-L2": [7, 7],
    "CDR-L3": [5, 15]

  var CONSERVED_CYS_RE = /[YF]C/;

  // CDR dataclass
  function makeCdr(name, start, end, seq) {
    return { name: name, start: start, end: end, seq: seq, length: end - start + 1 };
  }

  // Annotation dataclass. cdrs keeps insertion order like the Python dict.
  function makeAnnotation(seq) {
    return {
      sequence: seq, chain: null, cdrs: {}, anchors: {},
      confident: true, reasons: [], warnings: []

  }

  function cdrList(ann) {
    return Object.keys(ann.cdrs).map(function (k) { return ann.cdrs[k]; });
  }

  // Annotation.region_of
  function regionOf(ann, position) {

  // _last_match
  function lastMatch(re, seq) {

  }

  // _first_match_from
  function firstMatchFrom(re, seq, minPos) {
    if (minPos < 1) minPos = 1;

    return m ? m.index + 1 : null;

  // _first_residue_from
  function firstResidueFrom(seq, residue, minPos) {

  // _find_conserved_cys -> [position|null, foundByContext]
  function findConservedCys(seq, minPos, limit) {
    var start = Math.max(minPos - 2, 0);
    var ms = finditer(CONSERVED_CYS_RE, seq, start);
    for (var i = 0; i < ms.length; i++) {
      var pos = ms[i].index + 2;
      if (pos < minPos) continue;
      if (pos >= limit) break;
      return [pos, true];

    var fallback = firstResidueFrom(seq, "C", minPos);
    if (fallback !== null && fallback < limit) return [fallback, false];
    return [null, false];
  }

  // _find_conserved_trp -> [position|null, foundByFr2Context]
  function findConservedTrp(seq, minPos, context) {
    var m = search(context, seq, Math.max(minPos - 1, 0));
    if (m !== null && m.index + 1 >= minPos) return [m.index + 1, true];
    return [firstResidueFrom(seq, "W", minPos), false];

  // _cys_in_window -> [best|null, count]
  function cysInWindow(seq, window, expected) {
    var lo = window[0], hi = window[1];
    var found = [];
    var limit = Math.min(hi, seq.length);
    for (var i = 0; i < limit; i++) {
      if (seq.charAt(i) === "C" && i + 1 >= lo) found.push(i + 1);

    if (!found.length) return [null, 0];
    var best = found[0];
    for (var j = 1; j < found.length; j++) {
      var p = found[j];
      var dp = Math.abs(p - expected), db = Math.abs(best - expected);

  }

  // detect_chain
  function detectChain(seq) {
    var wgxg = lastMatch(WGXG_RE, seq);
    var fgxg = lastMatch(FGXG_RE, seq);
    if (wgxg === null && fgxg === null) return [null, null];
    if (fgxg === null) return ["H", wgxg];
    if (wgxg === null) return ["L", fgxg];
    return wgxg > fgxg ? ["H", wgxg] : ["L", fgxg];

  // detect_chain_by_j_tail
  function detectChainByJTail(seq) {
    var best = null;

  // annotate (called with validate_input=False from report.build)
  function annotate(seq) {

      motifPos = det[1];
      if (chain !== null) {
        var found = seq.slice(motifPos - 1, motifPos + 3);

          "말단 모티프(" + (chain === "H" ? "WGxG" : "FGxG") + ")가 " + found + " 로 치환돼 있어, " +
          "뒤따르는 J 유전자 꼬리(" + seq.slice(motifPos + 3, motifPos + 9) + ")로 " +
          motifPos + "번 위치와 체인(" + (chain === "H" ? "중쇄" : "경쇄") + ")을 잡았다."
        );
      }
    }
    if (chain === null) {
      ann.chain = null;
      ann.confident = false;
      ann.reasons.push(
        "말단 모티프를 찾지 못했다. 중쇄의 WGxG 또는 경쇄의 FGxG 가 없어서 " +
        "체인 종류(H/L)조차 판별할 수 없다. 서열이 중간에서 잘렸거나, 가변도메인이 " +
        "아니거나, 해당 보존 모티프가 치환된 경우다. CDR 위치는 추측하지 않는다."
      );
      return ann;
    }

    ann.chain = chain;
    ann.anchors.terminal_motif = motifPos;

    if (motifPos < seq.length * 0.5) {
      ann.warnings.push(
        "말단 모티프(" + (chain === "H" ? "WGxG" : "FGxG") + ")가 " + motifPos + "번째로 " +
        "서열 전반부에 있다. C-말단이 아닌 자리에 우연히 걸린 모티프일 수 있다."

    }

    else annotateLight(seq, ann);

    checkLengths(ann);
    return ann;
  }

  // _annotate_heavy
  function annotateHeavy(seq, ann) {
    var motifPos = ann.anchors.terminal_motif;

    // --- Anchor 1: Cys22 ---
    var cw = cysInWindow(seq, CYS1_WINDOW_H, CYS1_EXPECTED_H), cys1 = cw[0], nCys = cw[1];
    if (cys1 === null) {

      ann.reasons.push(
        "보존 Cys22 를 찾지 못했다. " + CYS1_WINDOW_H[0] + "-" + CYS1_WINDOW_H[1] + "번 구간에 " +
        "Cys 가 없다. 이 Cys 는 도메인 내부 이황화결합의 한쪽이라 거의 항상 보존된다. " +
        "N-말단이 잘렸거나 Cys 가 치환된 경우다. CDR-H1 위치는 추측하지 않는다."
      );
      return;
    }
    if (nCys > 1) {
      ann.warnings.push(
        CYS1_WINDOW_H[0] + "-" + CYS1_WINDOW_H[1] + "번 구간에 Cys 가 " + nCys + "개 있다. " +
        "22번에 가장 가까운 " + cys1 + "번을 앵커로 썼다. 결과를 ANARCI/IMGT 로 재확인할 것."
      );
    }

    // --- Anchor 2: Trp36, CDR-H1 ---
    var h1Start = cys1 + CDR1_OFFSET_H;
    if (h1Start > seq.length) {
      ann.confident = false;
      ann.reasons.push(
        "Cys22(" + cys1 + "번) 뒤로 서열이 " + (seq.length - cys1) + " 잔기밖에 없어 " +
        "CDR-H1 시작 위치가 서열 범위를 벗어난다. 서열이 잘린 것으로 보인다."
      );
      return;
    }

    var tr = findConservedTrp(seq, h1Start + MIN_CDR1_LENGTH_H, FR2_CONTEXT_H);
    var trp = tr[0], byContext = tr[1];
    if (trp !== null && !byContext) {
      ann.warnings.push(
        "보존 Trp36 을 FR2 문맥(W[VIA][RKQ]Q)으로 찾지 못해 " + trp + "번의 Trp 을 그대로 썼다. " +
        "CDR-H1 안에 Trp 이 있으면 경계가 밀릴 수 있다. ANARCI/IMGT 로 재확인할 것."
      );
    }
    if (trp === null || trp >= motifPos) {
      ann.confident = false;
      ann.reasons.push(
        "보존 Trp36 을 찾지 못했다. CDR-H1 시작 추정 위치(" + h1Start + "번) 이후에 " +
        "Trp 가 없다. 이 Trp 는 CDR-H1 의 끝을 정하는 앵커다. " +
        "CDR-H1/H2/H3 위치 모두 추측하지 않는다."
      );
      return;
    }
    if (trp === h1Start) {
      ann.confident = false;
      ann.reasons.push(
        "CDR-H1 시작 위치(" + h1Start + "번)가 곧 Trp 라서 CDR-H1 길이가 0 이 된다. " +
        "Cys22 앵커를 잘못 집었을 가능성이 높다."
      );
      return;
    }
    ann.anchors.trp = trp;
    ann.cdrs["CDR-H1"] = makeCdr("CDR-H1", h1Start, trp - 1, seq.slice(h1Start - 1, trp - 1));

    // --- Anchor 3: FR3 motif, CDR-H2 ---
    var h2Start = trp + CDR2_OFFSET_H;
    if (h2Start > seq.length) {
      ann.confident = false;
      ann.reasons.push(
        "Trp36(" + trp + "번) 뒤로 서열이 짧아 CDR-H2 시작 위치(" + h2Start + "번)가 " +
        "서열 범위를 벗어난다. 서열이 잘린 것으로 보인다."
      );
      return;
    }

    var searchFrom = h2Start + MIN_CDR_H2_BEFORE_MOTIF;
    var fr3 = firstMatchFrom(FR3_MOTIF_RE, seq, searchFrom);
    if (fr3 !== null && fr3 >= motifPos) fr3 = null;

    var cys2, cc;
    if (fr3 !== null) {
      cc = findConservedCys(seq, fr3, motifPos);
      cys2 = cc[0];
      byContext = cc[1];
      // Cross-check the FR3-motif-to-Cys distance (29); re-derive the motif from the Cys.
      if (cys2 !== null && cys2 - fr3 !== FR3_TO_CYS_GAP) {
        var corrected = cys2 - FR3_TO_CYS_GAP;
        if (corrected > h2Start) {
          ann.confident = false;
          ann.reasons.push(
            "FR3 시작 모티프를 " + fr3 + "번에서 찾았지만, 보존 Cys(" + cys2 + "번)까지의 거리가 " +
            (cys2 - fr3) + "로 통상값(" + FR3_TO_CYS_GAP + ")과 다르다. 모티프가 엉뚱한 자리에 " +
            "걸린 것으로 보여 Cys 기준으로 " + corrected + "번으로 고쳐 잡았다. " +
            "CDR-H2 경계를 ANARCI/IMGT 로 반드시 재확인할 것."

      byContext = cc[1];

        ann.confident = false;
        ann.reasons.push(
          "FR3 시작 모티프(" + FR3_MOTIF_PATTERN + ")를 찾지 못해, 보존 Cys(" + cys2 + "번)에서 " +
          FR3_TO_CYS_GAP + "잔기 역산해 CDR-H2 의 끝을 " + (fr3 - 1) + "번으로 잡았다. " +
          "체세포 과변이로 모티프가 깨진 서열에서 흔하다. 위치는 그대로 보고하지만 " +
          "모티프를 직접 확인한 것보다 근거가 약하므로, CDR-H2 경계를 " +
          "ANARCI/IMGT 로 반드시 재확인할 것."

      }

      ann.confident = false;
      ann.reasons.push(
        "CDR-H2 의 끝을 정할 수 없다. FR3 시작 모티프(" + FR3_MOTIF_PATTERN + ")가 없고, " +
        "보존 Cys 에서 역산할 수도 없다 (CDR-H2 시작 " + h2Start + "번). " +
        "CDR-H2/H3 위치는 추측하지 않는다."
      );
      return;
    }

    if (!byContext) {
      ann.warnings.push(
        "보존 Cys92 를 문맥(YC/FC) 으로 찾지 못해 " + cys2 + "번의 Cys 를 그대로 썼다. " +
        "FR3 에 여분 Cys 가 있으면 CDR-H3 시작이 밀릴 수 있다. ANARCI/IMGT 로 재확인할 것."
      );
    }

    ann.anchors.fr3_motif = fr3;
    ann.cdrs["CDR-H2"] = makeCdr("CDR-H2", h2Start, fr3 - 1, seq.slice(h2Start - 1, fr3 - 1));
    ann.anchors.cys2 = cys2;

    var h3Start = cys2 + CDR3_OFFSET_H;
    if (h3Start > motifPos - 1) {
      ann.confident = false;
      ann.reasons.push(
        "Cys92(" + cys2 + "번)와 말단 WGxG(" + motifPos + "번) 사이가 너무 좁아 " +
        "CDR-H3 길이가 0 이하가 된다. 두 앵커 중 하나를 잘못 집었을 가능성이 높다."
      );
      return;
    }
    ann.cdrs["CDR-H3"] = makeCdr("CDR-H3", h3Start, motifPos - 1,
      seq.slice(h3Start - 1, motifPos - 1));
  }

  // _annotate_light
  function annotateLight(seq, ann) {
    var motifPos = ann.anchors.terminal_motif;

    // --- Anchor 1: Cys23 ---
    var cw = cysInWindow(seq, CYS1_WINDOW_L, CYS1_EXPECTED_L), cys1 = cw[0], nCys = cw[1];
    if (cys1 === null) {
      ann.confident = false;
      ann.reasons.push(
        "보존 Cys23 을 찾지 못했다. " + CYS1_WINDOW_L[0] + "-" + CYS1_WINDOW_L[1] + "번 구간에 " +

        "CDR-L1 위치는 추측하지 않는다."
      );
      return;
    }

      ann.warnings.push(
        CYS1_WINDOW_L[0] + "-" + CYS1_WINDOW_L[1] + "번 구간에 Cys 가 " + nCys + "개 있다. " +
        "23번에 가장 가까운 " + cys1 + "번을 앵커로 썼다. 결과를 ANARCI/IMGT 로 재확인할 것."
      );
    }

    // --- Anchor 2: Trp35, CDR-L1 ---
    var l1Start = cys1 + CDR1_OFFSET_L;
    var tr = findConservedTrp(seq, l1Start + MIN_CDR1_LENGTH_L, FR2_CONTEXT_L);
    var trp = tr[0], byContext = tr[1];
    if (trp !== null && !byContext) {
      ann.warnings.push(
        "보존 Trp35 를 FR2 문맥(W[YF][QL]Q)으로 찾지 못해 " + trp + "번의 Trp 을 그대로 썼다. " +
        "CDR-L1 안에 Trp 이 있으면 경계가 밀릴 수 있다. ANARCI/IMGT 로 재확인할 것."
      );
    }
    if (trp === null || trp >= motifPos) {
      ann.confident = false;
      ann.reasons.push(
        "보존 Trp35 를 찾지 못했다. CDR-L1 시작 추정 위치(" + l1Start + "번) 이후에 " +
        "Trp 가 없다. 이 Trp 는 CDR-L1 의 끝을 정하는 앵커다. " +
        "CDR-L1/L2/L3 위치 모두 추측하지 않는다."
      );
      return;
    }
    if (trp === l1Start) {
      ann.confident = false;
      ann.reasons.push(
        "CDR-L1 시작 위치(" + l1Start + "번)가 곧 Trp 라서 CDR-L1 길이가 0 이 된다. " +
        "Cys23 앵커를 잘못 집었을 가능성이 높다."
      );
      return;
    }
    ann.anchors.trp = trp;
    ann.cdrs["CDR-L1"] = makeCdr("CDR-L1", l1Start, trp - 1, seq.slice(l1Start - 1, trp - 1));

    // --- CDR-L2 (fixed at 7 residues) ---
    var l2Start = trp + CDR2_OFFSET_L;
    var l2End = l2Start + CDR_L2_LENGTH - 1;
    if (l2End > seq.length || l2End >= motifPos) {
      ann.confident = false;
      ann.reasons.push(
        "Trp35(" + trp + "번) 기준으로 잡은 CDR-L2 구간(" + l2Start + "-" + l2End + "번)이 " +
        "서열 범위 또는 말단 FGxG 를 넘는다. 서열이 잘렸거나 Trp 앵커를 " +
        "잘못 집은 것으로 보인다. CDR-L2/L3 위치는 추측하지 않는다."
      );
      return;
    }
    ann.cdrs["CDR-L2"] = makeCdr("CDR-L2", l2Start, l2End, seq.slice(l2Start - 1, l2End));

    // --- Anchor 3: Cys88, CDR-L3 ---
    var cc = findConservedCys(seq, l2End + 1, motifPos);
    var cys2 = cc[0];
    byContext = cc[1];
    if (!byContext && cys2 !== null) {
      ann.warnings.push(
        "보존 Cys88 을 문맥(YC/FC) 으로 찾지 못해 " + cys2 + "번의 Cys 를 그대로 썼다. " +
        "FR3 에 여분 Cys 가 있으면 CDR-L3 시작이 밀릴 수 있다. ANARCI/IMGT 로 재확인할 것."
      );
    }
    if (cys2 === null || cys2 >= motifPos) {
      ann.confident = false;
      ann.reasons.push(
        "보존 Cys88 을 찾지 못했다. CDR-L2 종료(" + l2End + "번) 이후 말단 FGxG 전까지 " +
        "Cys 가 없다. 이 Cys 는 CDR-L3 시작을 정하는 앵커다. " +
        "CDR-L3 위치는 추측하지 않는다."
      );
      return;
    }
    ann.anchors.cys2 = cys2;

    var l3Start = cys2 + CDR3_OFFSET_L;
    if (l3Start > motifPos - 1) {
      ann.confident = false;
      ann.reasons.push(
        "Cys88(" + cys2 + "번)과 말단 FGxG(" + motifPos + "번) 사이가 너무 좁아 " +
        "CDR-L3 길이가 0 이하가 된다. 두 앵커 중 하나를 잘못 집었을 가능성이 높다."
      );
      return;
    }
    ann.cdrs["CDR-L3"] = makeCdr("CDR-L3", l3Start, motifPos - 1,
      seq.slice(l3Start - 1, motifPos - 1));
  }

  // _check_lengths (iterates CDRs sorted by name)
  function checkLengths(ann) {
    Object.keys(ann.cdrs).sort().forEach(function (name) {
      var cdr = ann.cdrs[name];
      var lo = TYPICAL_LENGTHS[name][0], hi = TYPICAL_LENGTHS[name][1];

        ann.confident = false;
        var bound = cdr.length < lo ? "짧다" : "길다";
        ann.reasons.push(
          name + " 길이가 " + cdr.length + " 잔기로 통상 범위(" + lo + "-" + hi + ")보다 " + bound + ". " +
          "앵커 자체는 찾았지만 경계가 밀렸을 수 있다. " +
          "ANARCI/IMGT 로 경계를 재확인할 것."
        );
      }
    });
  }

  // ==========================================================================
  // abcheck/liabilities.py
  // ==========================================================================

  var RISK_LEVELS = ["낮음", "중간", "높음"];
  var UNDETERMINED = "구간 미확정";

  // _shift
  function shiftLevel(level, step) {
    var idx = RISK_LEVELS.indexOf(level);
    return RISK_LEVELS[Math.max(0, Math.min(RISK_LEVELS.length - 1, idx + step))];
  }

  // MOTIF_SPECS (order matters: within a category the riskier motif comes first)
  var MOTIF_SPECS = [
    {
      kind: "glycosylation", pattern: /N[^P][ST]/, base_risk: "높음", label: "N-결합 당화 서열",
      rationale:
        "N-X-S/T (X≠Pro) 는 N-결합 당화 수용 서열이다. 당화가 일어나면 " +
        "불균일성(heterogeneity)이 생기고 배치 간 재현성이 떨어진다.",
      top_within_kind: true
    },
    {
      kind: "deamidation", pattern: /NG/, base_risk: "높음", label: "deamidation (NG)",
      rationale:
        "Asn-Gly 는 deamidation 속도가 가장 빠른 조합이다. Asn 이 Asp/isoAsp 로 " +
        "바뀌면 전하와 구조가 변해 결합력 손실로 이어질 수 있다.",
      top_within_kind: true
    },
    {
      kind: "deamidation", pattern: /N[STNH]/, base_risk: "중간", label: "deamidation (NS/NT/NN/NH)",
      rationale:
        "Asn 뒤 잔기에 따라 deamidation 이 일어날 수 있다. NG 보다는 느리지만 " +
        "장기 보관 안정성에서 확인이 필요하다.",
      top_within_kind: false
    },
    {
      kind: "isomerization", pattern: /DG/, base_risk: "높음", label: "isomerization (DG)",
      rationale:
        "Asp-Gly 는 isomerization 속도가 가장 빠른 조합이다. Asp 가 isoAsp 로 " +
        "바뀌면 주쇄가 한 원자 길어져 국소 구조가 틀어진다.",
      top_within_kind: true
    },
    {
      kind: "isomerization", pattern: /D[STD]/, base_risk: "중간", label: "isomerization (DS/DT/DD)",
      rationale:
        "Asp 뒤 잔기에 따라 isomerization 이 일어날 수 있다. DG 보다는 느리지만 " +
        "가속 안정성 시험에서 확인이 필요하다.",
      top_within_kind: false
    },
    {
      kind: "fragmentation", pattern: /DP/, base_risk: "중간", label: "fragmentation (DP)",
      rationale:
        "Asp-Pro 펩타이드 결합은 산성 조건에서 쉽게 끊어진다. 저장 완충액 pH 가 " +
        "낮으면 단편화가 나타날 수 있다.",
      top_within_kind: true
    },
    {
      kind: "oxidation", pattern: /M/, base_risk: "낮음", label: "산화 (Met)",
      rationale:
        "Met 은 산화되기 쉽다. 노출된 Met 이 산화되면 결합력이나 안정성이 떨어질 수 있다.",
      top_within_kind: false
    },
    {
      kind: "oxidation", pattern: /W/, base_risk: "낮음", label: "산화 (Trp)",
      rationale:
        "Trp 은 빛·금속 이온에 의해 산화될 수 있다. 보존 Trp 앵커(Trp36, WGxG 의 Trp)는 " +
        "대개 묻혀 있어 위험이 낮지만, 검출 자체는 숨기지 않는다.",
      top_within_kind: false
    }
  ];

  // _region_name -> [region, inCdr]
  function regionName(ann, start, end) {
    var cdrs = cdrList(ann);
    if (!cdrs.length) return [UNDETERMINED, false];
    for (var i = 0; i < cdrs.length; i++) {
      if (start <= cdrs[i].end && end >= cdrs[i].start) return [cdrs[i].name, true];
    }
    return ["framework", false];
  }

  // _adjust -> [risk, note]
  function adjust(base, inCdr, region) {
    if (region === UNDETERMINED) {
      return [base,
        "CDR 주석이 실패해 구간을 구분할 수 없다. 기본 등급을 그대로 쓴다 — " +
        "CDR 안일 수도 있으니 과소평가하지 말 것."];
    }
    var adjusted;
    if (inCdr) {
      adjusted = shiftLevel(base, +1);
      if (adjusted === base) {
        return [adjusted, region + " 안이고 기본 등급이 이미 최고(" + base + ")라 그대로 둔다."];
      }
      return [adjusted, region + " 안이라 기본 " + base + " 에서 한 단계 올렸다 (결합에 직접 영향)."];
    }
    adjusted = shiftLevel(base, -1);
    if (adjusted === base) {
      return [adjusted, "framework 이고 기본 등급이 이미 최저(" + base + ")라 그대로 둔다."];
    }
    return [adjusted, "framework 이라 기본 " + base + " 에서 한 단계 내렸다 (결합 영향이 간접적)."];
  }

  // find_liabilities -> {hits, domain_flags, warnings}
  function findLiabilities(ann) {
    var seq = ann.sequence;
    var report = { hits: [], domain_flags: [], warnings: [] };

    if (!cdrList(ann).length) {
      report.warnings.push(
        "CDR 주석이 실패해 CDR/framework 구간을 구분할 수 없다. " +
        "모든 모티프를 '구간 미확정'으로 보고하며 구간별 위험도 조정을 적용하지 않았다."
      );
    }

    var claimed = {};
    MOTIF_SPECS.forEach(function (spec) {
      var taken = claimed[spec.kind] || (claimed[spec.kind] = {});
      finditer(spec.pattern, seq, 0).forEach(function (m) {
        var start = m.index + 1, end = m.index + m[0].length;
        var p;
        for (p = start; p <= end; p++) {
          if (taken[p]) return;
        }
        for (p = start; p <= end; p++) taken[p] = true;

        var rg = regionName(ann, start, end);
        var adj = adjust(spec.base_risk, rg[1], rg[0]);
        report.hits.push({
          kind: spec.kind, label: spec.label, match: m[0], start: start, end: end,
          region: rg[0], in_cdr: rg[1], risk: adj[0], base_risk: spec.base_risk,
          rationale: spec.rationale, note: adj[1], top_within_kind: spec.top_within_kind
        });
      });
    });

    // sort key (start, kind); Array.prototype.sort is stable like Python's sort
    report.hits.sort(function (a, b) {
      if (a.start !== b.start) return a.start - b.start;
      return a.kind < b.kind ? -1 : a.kind > b.kind ? 1 : 0;
    });
    addCysteineFlag(seq, ann, report);
    return report;
  }

  // _add_cysteine_flag
  function addCysteineFlag(seq, ann, report) {
    var positions = [];
    for (var i = 0; i < seq.length; i++) {
      if (seq.charAt(i) === "C") positions.push(i + 1);
    }
    var count = positions.length;
    if (count % 2 === 0) return;

    var hasCdrs = cdrList(ann).length > 0;
    var regions = positions.map(function (p) { return hasCdrs ? regionOf(ann, p) : UNDETERMINED; });
    var inCdr = positions.filter(function (p, k) { return regions[k].indexOf("CDR") === 0; });
    var risk = inCdr.length ? "높음" : "중간";

    var rationale =
      "도메인 내 Cys 가 " + count + "개로 홀수다. 가변도메인은 보존 Cys 한 쌍이 " +
      "도메인 내부 이황화결합을 이루므로 개수는 보통 짝수다. 홀수면 짝을 못 이룬 " +
      "Cys 가 있다는 뜻이고, 이는 응집·이분자 가교·불균일한 이황화 짝짓기를 일으킬 수 있다.";
    if (inCdr.length) {
      rationale +=
        " 특히 CDR 안의 Cys(" + inCdr.join(", ") + "번)는 " +
        "결합 부위에 있어 위험도가 더 높다.";
    }

    report.domain_flags.push({
      kind: "unpaired_cysteine",
      label: "비결합 Cys 가능성",
      risk: risk,
      cysteine_count: count,
      positions: positions,
      regions: regions,
      rationale: rationale
    });
  }

  // LiabilityReport.counts_by_risk (high first)
  function countsByRisk(report) {
    var out = {};
    RISK_LEVELS.slice().reverse().forEach(function (lvl) {
      out[lvl] = report.hits.filter(function (h) { return h.risk === lvl; }).length;
    });
    return out;
  }

  // ==========================================================================
  // abcheck/properties.py
  // ==========================================================================

  var SIDE_CHAIN_PKA = { D: 3.9, E: 4.1, C: 8.5, Y: 10.1, H: 6.5, K: 10.8, R: 12.5 };
  var POSITIVE_RESIDUES = "KRH";
  var NEGATIVE_RESIDUES = "DECY";
  var PKA_N_TERMINUS = 8.6;
  var PKA_C_TERMINUS = 3.6;
  var KYTE_DOOLITTLE = {
    A: 1.8, R: -4.5, N: -3.5, D: -3.5, C: 2.5,
    Q: -3.5, E: -3.5, G: -0.4, H: -3.2, I: 4.5,
    L: 3.8, K: -3.9, M: 1.9, F: 2.8, P: -1.6,
    S: -0.8, T: -0.7, W: -0.9, Y: -1.3, V: 4.2
  };
  var DEFAULT_PH = 7.4;
  var PI_LOW = 0.0, PI_HIGH = 14.0, PI_TOLERANCE = 1e-6, PI_MAX_ITERATIONS = 200;

  function has(obj, key) {
    return Object.prototype.hasOwnProperty.call(obj, key);
  }

  // net_charge
  function netCharge(seq, ph, includeTermini) {
    if (includeTermini === undefined) includeTermini = true;
    seq = seq.toUpperCase();
    var charge = 0.0;
    if (includeTermini && seq) {
      charge += 1.0 / (1.0 + Math.pow(10, ph - PKA_N_TERMINUS));
      charge -= 1.0 / (1.0 + Math.pow(10, PKA_C_TERMINUS - ph));
    }
    for (var i = 0; i < seq.length; i++) {
      var r = seq.charAt(i);
      if (!has(SIDE_CHAIN_PKA, r)) continue;
      var pka = SIDE_CHAIN_PKA[r];
      if (POSITIVE_RESIDUES.indexOf(r) >= 0) charge += 1.0 / (1.0 + Math.pow(10, ph - pka));
      else if (NEGATIVE_RESIDUES.indexOf(r) >= 0) charge -= 1.0 / (1.0 + Math.pow(10, pka - ph));
    }
    return charge;
  }

  // isoelectric_point (bisection)
  function isoelectricPoint(seq, includeTermini) {
    if (includeTermini === undefined) includeTermini = true;
    seq = seq.toUpperCase();
    if (!seq) return null;
    var hasGroup = includeTermini || seq.split("").some(function (r) { return has(SIDE_CHAIN_PKA, r); });
    if (!hasGroup) return null;

    var low = PI_LOW, high = PI_HIGH;
    var chargeLow = netCharge(seq, low, includeTermini);
    var chargeHigh = netCharge(seq, high, includeTermini);
    if (chargeLow * chargeHigh > 0) {
      return Math.abs(chargeLow) < Math.abs(chargeHigh) ? low : high;
    }
    for (var it = 0; it < PI_MAX_ITERATIONS; it++) {
      var mid = (low + high) / 2.0;
      var chargeMid = netCharge(seq, mid, includeTermini);
      if (Math.abs(chargeMid) < PI_TOLERANCE || (high - low) < PI_TOLERANCE) return mid;
      if (chargeMid > 0) low = mid;
      else high = mid;
    }
    return (low + high) / 2.0;
  }

  // gravy -- integer tenths summed exactly, divided once (see properties.gravy)
  function gravy(seq) {
    seq = seq.toUpperCase();
    var total = 0, n = 0;
    for (var i = 0; i < seq.length; i++) {
      var r = seq.charAt(i);
      if (has(KYTE_DOOLITTLE, r)) { total += Math.round(KYTE_DOOLITTLE[r] * 10); n++; }
    }
    if (!n) return null;
    return total / (10 * n);
  }

  // compute + Properties.as_dict
  function propertiesDict(label, seq, ph) {
    seq = seq.toUpperCase();
    var pi = isoelectricPoint(seq);
    var gr = gravy(seq);
    return {
      label: label,
      sequence: seq,
      length: seq.length,
      pI: pi === null ? null : pyRound(pi, 2),
      GRAVY: gr === null ? null : pyRound(gr, 3),
      net_charge: pyRound(netCharge(seq, ph), 2),
      pH: ph
    };
  }

  // compute_all
  function computeAll(sequence, ann, ph) {
    var result = {};
    result["도메인 전체"] = propertiesDict("도메인 전체", sequence, ph);
    cdrsByStart(ann).forEach(function (cdr) {
      result[cdr.name] = propertiesDict(cdr.name, cdr.seq, ph);
    });
    return result;
  }

  // ==========================================================================
  // abcheck/triage.py
  // ==========================================================================

  var STATUS_REVIEW = "검토 필요";
  var STATUS_CLEAR = "기준 해당 없음";
  var STATUS_UNKNOWN = "판정 불가";
  var TRIAGE_NOTICE =
    "'검토 필요'는 아래 선별 규칙에 걸렸다는 뜻이지, 이 항체가 나쁘다는 뜻이 아니다. " +
    "'기준 해당 없음'도 안전하다는 뜻이 아니라 이 규칙에 걸리지 않았다는 뜻일 뿐이다. " +
    "규칙은 연구자가 정한 것이고, 도구는 그대로 적용만 한다.";

  // _cdr_high_risk
  function cdrHighRisk(report) {
    if (!report.liabilities) return [];
    var reasons = [];
    report.liabilities.hits.forEach(function (hit) {
      if (!hit.in_cdr) return;
      if (hit.risk === "높음" && hit.top_within_kind) {
        var label = hit.label.indexOf("(" + hit.match + ")") >= 0
          ? hit.label : hit.label + " (" + hit.match + ")";
        reasons.push(hit.region + " " + hit.start + "번에 " + label + " — 위험도 높음");
      }
    });
    return reasons;
  }

  // _domain_flag_high_risk
  function domainFlagHighRisk(report) {
    if (!report.liabilities) return [];
    return report.liabilities.domain_flags.filter(function (f) {
      return f.risk === "높음";
    }).map(function (f) {
      return f.label + " — 위험도 " + f.risk + " (Cys " + f.cysteine_count + "개, 홀수)";
    });
  }

  var DEFAULT_RULES = [
    {
      key: "cdr-high",
      description:
        "CDR 안에 위험도 '높음'이면서 각 분류의 최고 위험 모티프" +
        "(N-결합 당화, NG, DG, DP)가 1건 이상 있으면 검토 필요",
      check: cdrHighRisk
    },
    {
      key: "domain-high",
      description: "비결합 Cys 등 도메인 플래그가 위험도 '높음'이면 검토 필요",
      check: domainFlagHighRisk
    }
  ];

  // TriageResult.as_dict
  function triageResult(status, reasons, evaluable, note) {
    return {
      status: status,
      reasons: reasons || [],
      evaluable: evaluable === undefined ? true : evaluable,
      note: note || "",
      notice: TRIAGE_NOTICE
    };
  }

  // evaluate
  function evaluate(report) {
    if (!report.ok) {
      return triageResult(STATUS_UNKNOWN, [], false,
        "입력이 검증을 통과하지 못해 규칙을 적용할 수 없다.");
    }
    if (!report.annotation || !cdrList(report.annotation).length) {
      return triageResult(STATUS_UNKNOWN, [], false,
        "CDR 주석이 실패해 CDR 과 framework 를 가를 수 없다. " +
        "'CDR 안의 높음' 규칙을 적용할 수 없으므로 사람이 직접 확인해야 한다.");
    }
    var reasons = [];
    DEFAULT_RULES.forEach(function (rule) {
      reasons.push.apply(reasons, rule.check(report));
    });
    if (reasons.length) return triageResult(STATUS_REVIEW, reasons);
    if (!report.annotation.confident) {
      return triageResult(STATUS_UNKNOWN, [], true,
        "규칙에는 걸리지 않았지만 주석 신뢰도가 낮아(confident=False) CDR 경계가 " +
        "밀렸을 수 있다. 경계가 맞다는 보장이 없으므로 '기준 해당 없음'이라고 할 수 " +
        "없다. ANARCI/IMGT 로 경계를 확인한 뒤 판단할 것.");
    }
    return triageResult(STATUS_CLEAR);
  }

  function ruleDescriptions() {
    return DEFAULT_RULES.map(function (r) { return r.description; });
  }

  // ==========================================================================
  // abcheck/report.py
  // ==========================================================================

  // build -> internal SequenceReport-like object
  function build(seqId, sequence, ph) {
    var validation = validate(sequence);
    var report;
    if (!validation.ok) {
      report = {
        seq_id: seqId, sequence: validation.cleaned, ok: false,
        errors: validation.errors.slice(), warnings: validation.warnings.slice(),
        annotation: null, liabilities: null, properties: {}, triage: null
      };
      report.triage = evaluate(report);
      return report;
    }
    var cleaned = validation.cleaned;
    var ann = annotate(cleaned);
    var lia = findLiabilities(ann);
    var props = computeAll(cleaned, ann, ph);
    report = {
      seq_id: seqId, sequence: cleaned, ok: true, errors: [],
      warnings: validation.warnings.slice(), annotation: ann, liabilities: lia,
      properties: props, triage: null
    };
    report.triage = evaluate(report);
    return report;
  }

  function reportChain(report) {
    return report.annotation ? report.annotation.chain : null;
  }

  function reportConfident(report) {
    return Boolean(report.annotation && report.annotation.confident);
  }

  // SequenceReport.as_dict
  function reportAsDict(report) {
    var payload = {
      id: report.seq_id,
      tool: { name: "abcheck", version: VERSION },
      input_ok: report.ok,
      errors: report.errors.slice(),
      warnings: report.warnings.slice(),
      limitations: LIMITATION_NOTICE.slice(),
      no_verdict: NO_VERDICT_NOTICE
    };
    if (report.triage) payload.triage = cloneTriage(report.triage);
    if (!report.ok) return payload;

    var ann = report.annotation;
    payload.sequence = report.sequence;
    payload.length = report.sequence.length;
    var cdrs = {};
    cdrsByStart(ann).forEach(function (cdr) {
      cdrs[cdr.name] = { start: cdr.start, end: cdr.end, length: cdr.length, seq: cdr.seq };
    });
    var anchors = {};
    Object.keys(ann.anchors).forEach(function (k) { anchors[k] = ann.anchors[k]; });
    payload.annotation = {
      chain: ann.chain,
      confident: ann.confident,
      reasons: ann.reasons.slice(),
      warnings: ann.warnings.slice(),
      anchors: anchors,
      coordinates: "1-based, 양끝 포함",
      cdrs: cdrs
    };

    var lia = report.liabilities;
    payload.liabilities = {
      warnings: lia.warnings.slice(),
      counts_by_risk: countsByRisk(lia),
      hits: lia.hits.map(function (h) {
        return {
          kind: h.kind, label: h.label, match: h.match, start: h.start, end: h.end,
          region: h.region, in_cdr: h.in_cdr, risk: h.risk, base_risk: h.base_risk,
          rationale: h.rationale, risk_note: h.note
        };
      }),
      domain_flags: lia.domain_flags.map(cloneFlag)
    };

    var props = {};
    Object.keys(report.properties).forEach(function (k) {
      props[k] = Object.assign({}, report.properties[k]);
    });
    payload.properties = props;
    return payload;
  }

  function cloneTriage(t) {
    return {
      status: t.status, reasons: t.reasons.slice(), evaluable: t.evaluable,
      note: t.note, notice: t.notice
    };
  }

  function cloneFlag(f) {
    return {
      kind: f.kind, label: f.label, risk: f.risk, cysteine_count: f.cysteine_count,
      positions: f.positions.slice(), regions: f.regions.slice(), rationale: f.rationale
    };
  }

  var SUMMARY_REGIONS = ["CDR1", "CDR2", "CDR3", "framework"];
  var SUMMARY_NOTE =
    "아래는 건수 집계일 뿐이며 종합 판정이 아니다. 건수가 적다고 안전한 것도, " +
    "많다고 탈락시킬 근거도 되지 않는다. 각 서열의 상세 항목과 근거를 함께 볼 것.";
  var UNASSIGNED_REGION = "framework";
  var CHAIN_GROUP_TITLES = { H: "중쇄 (VH)", L: "경쇄 (VL)", None: "체인 판별 실패 · 입력 오류" };

  // cdr_labels
  function cdrLabels(chain) {
    if (chain === "H" || chain === "L") {
      return [1, 2, 3].map(function (i) { return "CDR-" + chain + i; });
    }
    return ["CDR1", "CDR2", "CDR3"];
  }

  // _slot_of
  function slotOf(region) {
    if (region.indexOf("CDR-") === 0 && /[0-9]$/.test(region)) {
      return "CDR" + region.charAt(region.length - 1);
    }
    if (region === UNDETERMINED) return UNASSIGNED_REGION;
    return "framework";
  }

  // _empty_counts
  function emptyCounts() {
    var out = {};
    RISK_LEVELS.slice().reverse().forEach(function (lvl) { out[lvl] = 0; });
    return out;
  }

  function emptyRegionCounts() {
    var out = {};
    SUMMARY_REGIONS.forEach(function (r) { out[r] = emptyCounts(); });
    return out;
  }

  // summarize
  function summarize(reports) {
    var rows = [];
    var totals = emptyRegionCounts();
    var flagTotal = 0;

    reports.forEach(function (report) {
      var regions = emptyRegionCounts();
      var unassigned = false;

      if (report.ok && report.liabilities) {

          "엑셀 파일(.xlsx)은 바로 읽지 않는다. 엑셀에서 '파일 → 다른 이름으로 저장 → " +
          "CSV UTF-8' 로 저장한 뒤 그 .csv 파일을 넣어라. 첫 줄에 'id,sequence' 처럼 " +
          "열 이름이 있으면 된다."
        );
      }
      // _read_text decodes with utf-8-sig / utf-16, both of which drop a leading BOM
      if (text.charAt(0) === "﻿") text = text.slice(1);
      if (has(TABLE_SUFFIXES, suffix)) {
        return [readTable(text, TABLE_SUFFIXES[suffix]), "표 파일 (" + filename + ")"];
      }
      if (JSON_SUFFIXES.indexOf(suffix) >= 0) {
        return [readCorpusJson(text), "코퍼스 JSON (" + filename + ")"];
      }
      if (FASTA_SUFFIXES.indexOf(suffix) >= 0 || pyLStrip(text).charAt(0) === ">") {
        return [readFasta(text), "FASTA (" + filename + ")"];
      }
      return [[[parts.stem, text]], "서열 파일 (" + filename + ")"];
    }
    if (pyLStrip(text).charAt(0) === ">") return [readFasta(text), "붙여넣은 FASTA"];
    return [[["입력 서열", text]], "붙여넣은 서열"];
  }

  return {
    version: VERSION,
    DEFAULT_PH: DEFAULT_PH,
    analyze: analyze,
    analyzeJSON: analyzeJSON,
    toJSON: toJSON,
    readInput: readInput,
    // lower-level pieces, exposed for tests and for the UI
    validate: validate,
    annotate: annotate,
    readFasta: readFasta,
    readTable: readTable,
    readCorpusJson: readCorpusJson,
    _py: {
      round: pyRound,
      floatRepr: pyFloatRepr,
      reprStr: pyReprStr,
      strip: pyStrip,
      splitLines: pySplitLines,
      jsonLoads: pyJsonLoads,
      str: pyStr
    }
  };
});

/*
 * app-lib.js -- pure helpers behind the AbCheck browser app (no DOM, no dependencies).

  var RISKS = ["높음", "중간", "낮음"];
  var CDR_REGIONS = ["CDR1", "CDR2", "CDR3"];

  /* The liability motifs as abcheck/liabilities.py MOTIF_SPECS defines them, in the same
     order. Shown on the rules screen; a test keeps this list equal to the Python one. */
  var MOTIFS = [
    { pattern: "N[^P][ST]", name: "N-결합 당화", base: "높음", top: true },
    { pattern: "NG", name: "deamidation", base: "높음", top: true },
    { pattern: "N[STNH]", name: "deamidation", base: "중간", top: false },
    { pattern: "DG", name: "isomerization", base: "높음", top: true },
    { pattern: "D[STD]", name: "isomerization", base: "중간", top: false },
    { pattern: "DP", name: "fragmentation", base: "중간", top: true },
    { pattern: "M", name: "산화 (Met)", base: "낮음", top: false },
    { pattern: "W", name: "산화 (Trp)", base: "낮음", top: false }
  ];

  /* Headline validation figures (README.md / VALIDATION.md). A test checks every one of
     these strings still appears in those documents. */
  var VALIDATION = {
    sequences: "7,000",
    datasets: "7",
    passedInput: "6,984",
    chainCorrect: "6,980",
    chainWrong: "0",
    annotation: "98.7%",
    confident: "96.0%",
    boundary: "0.35%",
    boundaryOf: "58/16,498",
    fr3Gap: "3,429 / 3,443",
    rows: [
      ["Jaffe 2022", "사람 · naive B", "100%", "99.9%", "1000/1000", "0.00%"],
      ["Alsoiussi 2020", "마우스 · plasmablast", "100%", "99.2%", "1000/1000", "0.00%"],
      ["King 2020", "사람 · memory B", "99.7%", "95.3%", "1000/1000", "0.46%"],
      ["Ota 2024", "사람 · memory B", "99.9%", "95.8%", "1000/1000", "0.63%"],
      ["Phad 2022", "사람 · plasma B", "99.9%", "93.9%", "999/1000", "0.84%"],
      ["Setliff 2019", "사람 · unsorted B (HIV)", "100%", "97.8%", "1000/1000", "0.25%"],
      ["Sokal 2021", "사람 · memory B (잘린 read 포함)", "91.6%", "89.8%", "981/984", "0.28%"]
    ]
  };

  function zero() { return { "높음": 0, "중간": 0, "낮음": 0 }; }

  function addCounts(into, c) {
    RISKS.forEach(function (k) { into[k] += c[k] || 0; });
    return into;
  }

  /** "높음 1 · 낮음 2", or "-" when nothing was found. */
  function countText(c) {
    var parts = RISKS.filter(function (k) { return c[k]; }).map(function (k) { return k + " " + c[k]; });
    return parts.length ? parts.join(" · ") : "-";
  }

  /** Which sidebar lists a sequence belongs to. A sequence can be in two (needs review AND
      not confident). Keys double as the app's view names. */
  function categories(row) {
    var c = [];
    if (!row.inputOk) c.push("errors");
    if (row.status === "검토 필요") c.push("review");
    if (row.inputOk && !row.confident) c.push("recheck");
    return c;
  }

  /** One flat record per input sequence, joining the engine's per-sequence report with its
      summary row (same index: the engine keeps input order in both). */
  function buildRows(payload) {
    var srows = payload.summary.rows;
    if (srows.length !== payload.sequences.length) {
      throw new Error("summary rows (" + srows.length + ") and sequences (" +
        payload.sequences.length + ") differ in length");

      var r = srows[i];

      var a = s.annotation || null;
      var cdrs = a ? Object.keys(a.cdrs).map(function (k) {
        var c = a.cdrs[k];
        return { name: k, start: c.start, end: c.end, length: c.length, seq: c.seq };
      }) : [];
      var whole = s.properties ? s.properties["도메인 전체"] : null;
      var cdrCounts = zero();
      if (r.input_ok && !r.regions_unassigned) {
        CDR_REGIONS.forEach(function (reg) { addCounts(cdrCounts, r.regions[reg]); });
      }
      var row = {
        index: i,
        id: s.id,
        inputOk: s.input_ok,
        chain: a ? a.chain : null,
        confident: !!(a && a.confident),
        annotated: !!r.annotated,
        regionsUnassigned: !!r.regions_unassigned,
        status: s.triage.status,
        reasons: s.triage.reasons,
        note: s.triage.note,
        cdrs: cdrs,
        cdr3: cdrs.filter(function (c) { return /3$/.test(c.name); })[0] || null,
        cdrCounts: cdrCounts,
        fwCounts: r.input_ok ? addCounts(zero(), r.regions.framework) : zero(),
        flags: r.domain_flags || [],
        length: s.input_ok ? s.length : null,
        pI: whole ? whole.pI : null,
        gravy: whole ? whole.GRAVY : null,
        charge: whole ? whole.net_charge : null,
        pH: whole ? whole.pH : null,
        errors: s.errors || [],
        sequence: s.sequence || ""
      };

  /** Counts for the sidebar and the stat line. */
  function tally(rows) {
    var t = { all: rows.length, review: 0, recheck: 0, errors: 0, clear: 0, H: 0, L: 0 };
    rows.forEach(function (r) {
      r.cats.forEach(function (c) { t[c] += 1; });
      if (r.status === "기준 해당 없음") t.clear += 1;
      if (r.chain === "H") t.H += 1;
      if (r.chain === "L") t.L += 1;
    });
    return t;
  }

  /** view: all|review|recheck|errors · chain: all|H|L · query: name, or residues in a CDR
      or in the whole sequence (3+ letters). */
  function filterRows(rows, opts) {
    var view = opts.view || "all", chain = opts.chain || "all";
    var q = String(opts.query || "").trim();
    var qName = q.toLowerCase();
    var qSeq = /^[A-Za-z]{3,}$/.test(q) ? q.toUpperCase() : null;
    return rows.filter(function (r) {
      if (view !== "all" && r.cats.indexOf(view) < 0) return false;
      if (chain !== "all" && r.chain !== chain) return false;
      if (!q) return true;
      if (r.id.toLowerCase().indexOf(qName) >= 0) return true;
      return !!(qSeq && r.sequence.indexOf(qSeq) >= 0);
    });
  }

  /** input (default) · name · pi-desc · pi-asc. Sorting never ranks by liabilities: the
      tool gives no overall verdict. Rows without a pI go last. */
  function sortRows(rows, key) {

    var byIndex = function (a, b) { return a.index - b.index; };

      out.sort(function (a, b) {
        return a.id.localeCompare(b.id, "ko", { numeric: true }) || byIndex(a, b);
      });
    } else if (key === "pi-desc" || key === "pi-asc") {
      var dir = key === "pi-desc" ? -1 : 1;
      out.sort(function (a, b) {
        if (a.pI === null && b.pI === null) return byIndex(a, b);
        if (a.pI === null) return 1;
        if (b.pI === null) return -1;
        return (a.pI - b.pI) * dir || byIndex(a, b);
      });

  /** Identical CDR sequences shared by two or more candidates: [{name, seq, ids}]. */
  function sharedCdrs(rows) {

        var key = c.name + "|" + c.seq;
        if (!groups[key]) { groups[key] = { name: c.name, seq: c.seq, ids: [] }; order.push(key); }
        if (groups[key].ids.indexOf(r.id) < 0) groups[key].ids.push(r.id);

  /** Round axis ticks covering [min, max]: {lo, hi, step, ticks}. */
  function niceTicks(min, max, count) {
    count = count || 5;
    if (!(isFinite(min) && isFinite(max))) throw new Error("niceTicks needs finite bounds, got " + min + ", " + max);
    if (min === max) { min -= 0.5; max += 0.5; }

    for (var v = lo; v <= hi + step / 2; v += step) ticks.push(Number(v.toFixed(decimals)));

    "CDR 플래그", "framework 플래그", "도메인 플래그", "길이", "pI", "GRAVY", "net charge", "pH",
    "선별 근거", "입력 오류"];

    return rows.map(function (r) {
      var cdr = function (n) { return r.cdrs[n] ? r.cdrs[n].seq : ""; };

        r.status, r.inputOk ? (r.confident ? "신뢰 가능" : "신뢰 불가") : "",
        cdr(0), cdr(1), cdr(2),
        r.inputOk && !r.regionsUnassigned ? countText(r.cdrCounts) : (r.inputOk ? "주석 실패" : ""),
        r.inputOk ? countText(r.fwCounts) : "",
        r.flags.map(function (f) { return f.label + " (" + f.risk + ")"; }).join(", "),
        r.length === null ? "" : r.length,
        r.pI === null ? "" : r.pI, r.gravy === null ? "" : r.gravy,
        r.charge === null ? "" : r.charge, r.pH === null ? "" : r.pH,
        r.reasons.join(" / "), r.errors.join(" / ")
      ];
    });
  }

  /** CSV for Excel: UTF-8 with BOM (so Korean opens correctly), CRLF, RFC 4180 quoting. */
  function toCsv(rows) {
    var q = function (v) {
      var s = String(v);
      return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    };
    var lines = [TABLE_HEAD].concat(tableRecords(rows)).map(function (rec) { return rec.map(q).join(","); });
    return "﻿" + lines.join("\r\n") + "\r\n";
  }

  /** Tab-separated text for pasting into Excel or Sheets. */
  function toTsv(rows) {
    var clean = function (v) { return String(v).replace(/[\t\r\n]+/g, " "); };
    return [TABLE_HEAD].concat(tableRecords(rows)).map(function (rec) { return rec.map(clean).join("\t"); }).join("\n");
  }

  /** Sequences as FASTA text (valid inputs only). */
  function toFasta(rows) {
    return rows.filter(function (r) { return r.inputOk; }).map(function (r) {
      return ">" + r.id + "\n" + r.sequence.replace(/(.{60})/g, "$1\n").replace(/\n$/, "") + "\n";
    }).join("");
  }

  return {
    RISKS: RISKS, MOTIFS: MOTIFS, VALIDATION: VALIDATION, TABLE_HEAD: TABLE_HEAD,
    countText: countText, categories: categories, buildRows: buildRows, tally: tally,
    filterRows: filterRows, sortRows: sortRows, sharedCdrs: sharedCdrs, niceTicks: niceTicks,
    toCsv: toCsv, toTsv: toTsv, toFasta: toFasta
  };
});

  /* ---------- shared bits ---------- */
  function tag(status) {
    const cls = status === "검토 필요" ? "review" : status === "판정 불가" ? "unknown" : "clear";
    return `<span class="tag ${cls}">${esc(status)}</span>`;
  }
  const chainBadge = (r) => (r.chain ? `<span class="chain">${r.chain === "H" ? "VH" : "VL"}</span>` : "");
  const seqObj = (r) => state.payload.sequences[r.index];

  /** CDR residues with liability positions underlined (positions are 1-based in the domain). */
  function markedCdr(cdr, hits) {
    const marks = new Array(cdr.length).fill(null);
    (hits || []).forEach((x) => {
      for (let p = Math.max(x.start, cdr.start); p <= Math.min(x.end, cdr.end); p++) {
        const k = p - cdr.start;
        marks[k] = (marks[k] ? marks[k] + " / " : "") + `${x.label} · ${x.risk}`;
      }
    });
    let out = "", buf = "", cur = null;
    const flush = () => { if (!buf) return; out += cur ? `<u title="${esc(cur)}">${esc(buf)}</u>` : esc(buf); buf = ""; };
    for (let k = 0; k < cdr.seq.length; k++) {
      if (marks[k] !== cur) { flush(); cur = marks[k]; }
      buf += cdr.seq[k];
    }
    flush();
    return out;
  }

  function ruler(seq, cdrs, hits) {
    const at = new Array(seq.length + 2).fill(null), liab = new Array(seq.length + 2).fill(null);
    cdrs.forEach((c) => { for (let i = c.start; i <= c.end; i++) at[i] = c.name; });
    (hits || []).forEach((x) => { for (let i = x.start; i <= x.end; i++) liab[i] = (liab[i] ? liab[i] + " / " : "") + `${x.label} ${x.match} · ${x.risk}`; });
    const width = 50;
    let out = "";
    for (let off = 0; off < seq.length; off += width) {
      let line = "", cur = null, curL = null, buf = "";
      const names = [];
      const flush = () => {
        if (!buf) return;
        let t = esc(buf);
        if (curL) t = `<u title="${esc(curL)}">${t}</u>`;
        line += cur ? `<span class="c" title="${esc(cur)}">${t}</span>` : t;
        buf = "";
      };
      for (let i = off; i < Math.min(off + width, seq.length); i++) {
        if (i > off && (i - off) % 10 === 0) { flush(); line += " "; }
        const n = at[i + 1], l = liab[i + 1];
        if (n !== cur || l !== curL) { flush(); cur = n; curL = l; }
        buf += seq[i];
        if (n && !names.includes(n)) names.push(n);
      }
      flush();
      out += `<span class="p">${String(off + 1).padStart(4, " ")}  </span>${line}${names.length ? `  <span class="l">${esc(names.join(", "))}</span>` : ""}\n`;
    }
    return out;
  }

  /* ---------- views ---------- */
  function viewNew() {

    return `

        </div>
        ${err}
      </div>
      <div class="sect">
        <h3>넣을 때 참고</h3>
        <ul class="hints">
          <li>파일은 입력창에 끌어다 놓아도 됨 · <kbd>Ctrl</kbd>/<kbd>⌘</kbd> + <kbd>Enter</kbd> 로 분석</li>
          <li>공백 · 줄바꿈 · 소문자 · 정렬 갭(<code>.</code> <code>-</code>)은 자동 정리</li>
          <li>한 서열 = VH 또는 VL 도메인 하나(70–200 잔기) · scFv · Fab 는 VH 와 VL 로 나눠서</li>
          <li>메모장 · 엑셀이 저장한 UTF-8 · UTF-16 · cp949 파일 모두 읽음 · .xlsx 는 'CSV UTF-8' 로 저장 후 열기</li>
        </ul>
      </div>`;
  }

  function listView(view) {

        <div class="seg" role="group" aria-label="체인">
          ${[["all", "전체", rows.length], ["H", "VH", t.H], ["L", "VL", t.L]].map(([k, l, n]) =>
            `<button type="button" data-chain="${k}" aria-pressed="${state.chain === k}"${n ? "" : " disabled"}>${l}<b>${n}</b></button>`).join("")}
        </div>
        <label class="sr" for="sort">정렬</label>
        <select id="sort">
          ${[["input", "입력 순"], ["name", "이름 순"], ["pi-desc", "pI 높은 순"], ["pi-asc", "pI 낮은 순"]].map(([k, l]) =>
            `<option value="${k}"${state.sort === k ? " selected" : ""}>${l}</option>`).join("")}
        </select>
        <span class="spacer"></span>
        <button class="btn" type="button" id="copy-tsv">표 복사</button>

      </div>`;
    if (!shown.length) {

      h += `<div class="blank"><b>${why}</b>${view === "all" && !state.query ? "" : "다른 목록을 보거나 검색어를 지우면 됨."}</div>`;
    } else {
      const page = shown.slice(0, state.limit);
      h += `<div class="scroll"><table class="list"><thead><tr>
          <th>서열</th><th>분류</th><th>주석</th><th>CDR3</th><th>CDR 플래그</th><th>framework</th><th>도메인 플래그</th>
          <th class="num">pI</th><th class="num">GRAVY</th></tr></thead><tbody>` +
        page.map((r) => {
          const s = seqObj(r);
          const cdr3 = r.cdr3 ? `${markedCdr(r.cdr3, s.liabilities ? s.liabilities.hits : [])}<small>${r.cdr3.length}</small>` : `<span class="muted">-</span>`;
          return `<tr data-i="${r.index}">
            <td class="nowrap"><button class="rowlink" type="button" data-open="${r.index}">${esc(r.id)}</button>${chainBadge(r)}</td>
            <td>${tag(r.status)}</td>
            <td class="nowrap">${!r.inputOk ? "입력 오류" : r.confident ? "신뢰 가능" : "신뢰 불가"}</td>
            <td class="seqcell">${cdr3}</td>
            <td class="nowrap">${!r.inputOk ? "-" : r.regionsUnassigned ? "주석 실패" : ABUI.countText(r.cdrCounts)}</td>
            <td class="nowrap">${r.inputOk ? ABUI.countText(r.fwCounts) : "-"}</td>
            <td>${r.flags.length ? esc(r.flags.map((f) => f.label + " (" + f.risk + ")").join(", ")) : "-"}</td>
            <td class="num">${fmt(r.pI, 2)}</td><td class="num">${fmt(r.gravy, 3)}</td></tr>`;
        }).join("") + `</tbody></table></div>`;
      if (shown.length > page.length) h += `<button class="btn more" type="button" id="more">나머지 ${shown.length - page.length}건 더 보기</button>`;
    }
    h += `<div class="foot"><p>${esc(state.payload.summary.note)}</p><p>${esc(state.payload.no_verdict)}</p></div>`;
    return h;
  }

  function compareView() {
    const rows = ABUI.filterRows(state.rows, { view: "all", chain: "all", query: state.query }).filter((r) => r.cdrs.length);
    state.openList = rows;
    let h = `<div class="bar"><h2>CDR 비교</h2><span class="cnt">${rows.length}건</span></div>
      <p class="sub">같은 체인끼리 CDR 서열을 나란히 표시. 밑줄 = liability 모티프 (마우스를 올리면 내용). 숫자 = 잔기 수.</p>`;
    const shared = ABUI.sharedCdrs(rows);
    if (shared.length) {
      h += `<div class="sect"><h3>같은 CDR 서열을 가진 후보</h3><div class="callout">` +
        shared.map((g) => `<div><strong>${esc(g.name)}</strong> <span class="mono">${esc(g.seq)}</span> — ${g.ids.map(esc).join(", ")}</div>`).join("") +
        `</div></div>`;
    }
    if (!rows.length) return h + `<div class="blank"><b>비교할 CDR 없음</b>CDR 주석이 성공한 서열이 없거나 검색 결과가 없음.</div>`;
    [["H", "중쇄 (VH)", ["CDR-H1", "CDR-H2", "CDR-H3"]], ["L", "경쇄 (VL)", ["CDR-L1", "CDR-L2", "CDR-L3"]]].forEach(([chain, title, names]) => {
      const group = rows.filter((r) => r.chain === chain);

      h += `<div class="sect"><h3>${title} <span class="muted small">${group.length}건</span></h3><div class="scroll"><table class="list"><thead><tr>
        <th>서열</th><th>분류</th>${names.map((n) => `<th>${n}</th>`).join("")}</tr></thead><tbody>` +
        group.map((r) => {
          const hits = seqObj(r).liabilities ? seqObj(r).liabilities.hits : [];
          const cells = names.map((n) => {
            const c = r.cdrs.find((x) => x.name === n);
            return `<td class="seqcell">${c ? markedCdr(c, hits) + `<small>${c.length}</small>` : `<span class="muted">-</span>`}</td>`;
          }).join("");
          return `<tr data-i="${r.index}"><td class="nowrap"><button class="rowlink" type="button" data-open="${r.index}">${esc(r.id)}</button></td><td>${tag(r.status)}</td>${cells}</tr>`;
        }).join("") + `</tbody></table></div></div>`;
    });
    return h;
  }

  function scatter(rows) {
    const pts = rows.filter((r) => r.pI !== null && r.gravy !== null);
    const W = 760, H = 430, m = { l: 62, r: 30, t: 20, b: 52 };
    const xs = pts.map((r) => r.pI), ys = pts.map((r) => r.gravy);
    const xt = ABUI.niceTicks(Math.min(...xs) - 0.3, Math.max(...xs) + 0.3, 7);
    const yt = ABUI.niceTicks(Math.min(...ys) - 0.1, Math.max(...ys) + 0.1, 6);
    const X = (v) => m.l + (v - xt.lo) / (xt.hi - xt.lo) * (W - m.l - m.r);
    const Y = (v) => H - m.b - (v - yt.lo) / (yt.hi - yt.lo) * (H - m.t - m.b);
    const label = pts.length <= 15;
    let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="도메인 pI 와 GRAVY 산점도, 서열 ${pts.length}개">`;
    s += `<g class="grid">` + xt.ticks.map((v) => `<line x1="${X(v)}" x2="${X(v)}" y1="${m.t}" y2="${H - m.b}"/>`).join("") +
      yt.ticks.map((v) => `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(v)}" y2="${Y(v)}"/>`).join("") + `</g>`;
    s += `<g class="axis"><line x1="${m.l}" x2="${W - m.r}" y1="${H - m.b}" y2="${H - m.b}"/><line x1="${m.l}" x2="${m.l}" y1="${m.t}" y2="${H - m.b}"/></g>`;
    s += xt.ticks.map((v) => `<text x="${X(v)}" y="${H - m.b + 18}" text-anchor="middle">${v}</text>`).join("");
    s += yt.ticks.map((v) => `<text x="${m.l - 9}" y="${Y(v) + 4}" text-anchor="end">${v}</text>`).join("");
    s += `<text class="ttl" x="${(m.l + W - m.r) / 2}" y="${H - 10}" text-anchor="middle">pI (도메인 전체)</text>`;
    s += `<text class="ttl" transform="translate(16 ${(m.t + H - m.b) / 2}) rotate(-90)" text-anchor="middle">GRAVY</text>`;
    s += pts.map((r) => {
      const x = X(r.pI), y = Y(r.gravy);
      const mark = r.chain === "L"
        ? `<rect class="mark-l" x="${x - 5}" y="${y - 5}" width="10" height="10" rx="1.5"/>`
        : `<circle class="mark-h" cx="${x}" cy="${y}" r="5.5"/>`;
      // labels sit right of the point, or left of it near the right edge so they stay inside the plot
      const right = x < W - m.r - 120;
      const lab = label ? `<text class="lab" x="${right ? x + 9 : x - 9}" y="${y + 4}" text-anchor="${right ? "start" : "end"}">${esc(r.id)}</text>` : "";
      return `<g class="pt" tabindex="0" role="button" data-open="${r.index}" data-x="${x}" data-y="${y}" aria-label="${esc(r.id)}, pI ${fmt(r.pI, 2)}, GRAVY ${fmt(r.gravy, 3)}">
        <circle class="hitarea" cx="${x}" cy="${y}" r="13"/>${mark}${lab}</g>`;
    }).join("");
    return { svg: s + `</svg>`, count: pts.length, W };
  }

      <th>서열</th><th>체인</th><th class="num">길이</th><th class="num">pI</th><th class="num">GRAVY</th><th class="num">net charge</th><th class="num">CDR3 pI</th><th class="num">CDR3 GRAVY</th></tr></thead><tbody>` +
      rows.slice(0, state.limit).map((r) => {
        const p = seqObj(r).properties || {};
        const c3 = r.cdr3 ? p[r.cdr3.name] : null;
        return `<tr data-i="${r.index}"><td class="nowrap"><button class="rowlink" type="button" data-open="${r.index}">${esc(r.id)}</button></td>
          <td>${r.chain === "H" ? "VH" : r.chain === "L" ? "VL" : "-"}</td><td class="num">${r.length}</td>
          <td class="num">${fmt(r.pI, 2)}</td><td class="num">${fmt(r.gravy, 3)}</td><td class="num">${signed(r.charge)}</td>
          <td class="num">${c3 ? fmt(c3.pI, 2) : "-"}</td><td class="num">${c3 ? fmt(c3.GRAVY, 3) : "-"}</td></tr>`;
      }).join("") + `</tbody></table></div>
      <p class="small muted">CDR 별 pI 는 조각을 독립 펩타이드로 계산한 값 — 구간끼리 상대 비교용.</p></div>`;
    return h;
  }

  function rulesView() {
    const s = state.payload.summary;
    const shift = (base, step) => { const L = ["낮음", "중간", "높음"]; return L[Math.max(0, Math.min(2, L.indexOf(base) + step))]; };
    return `<div class="bar"><h2>선별 규칙</h2></div>

        <tr><td>${tag("검토 필요")}</td><td>위 규칙에 하나 이상 걸림 · 먼저 들여다볼 서열</td></tr>

        <tr><td>${tag("판정 불가")}</td><td>입력 오류 · CDR 주석 실패 · 주석 신뢰도가 낮아 CDR 경계를 믿을 수 없음 · 사람이 직접 확인</td></tr>
      </tbody></table></div></div>

        <p class="small muted">같은 모티프라도 CDR 안이면 한 단계 올리고 framework 면 한 단계 내림. 선별 규칙은 각 분류에서 가장 빠른 모티프만 봄.</p>

        `<tr><td class="seqcell">Cys 홀수</td><td>비결합 Cys 가능성</td><td>-</td><td>높음</td><td>중간</td><td>예 (높음일 때)</td></tr>
        </tbody></table></div>
        <p class="small muted">규칙 원본: abcheck/triage.py · abcheck/liabilities.py — 웹 엔진도 같은 규칙 사용.</p></div>`;
  }

  function validationView() {

      <p class="sub">공개 항체 레퍼토리 OAS(Observed Antibody Space) ${v.sequences} 서열, ${v.datasets}개 데이터셋으로 측정. 숫자는 저장소 스크립트로 다시 재현 가능.</p>
      <div class="tiles">
        <div class="tile"><span>측정한 서열</span><b>${v.sequences}</b><i>공개 데이터셋 ${v.datasets}개 · 사람 · 마우스</i></div>
        <div class="tile"><span>체인(H/L) 오판</span><b>${v.chainWrong}</b><i>입력 검증 통과 ${v.passedInput}건 중</i></div>

        v.rows.map((r) => `<tr><td class="nowrap">${esc(r[0])}</td><td>${esc(r[1])}</td>${r.slice(2).map((c) => `<td class="num">${esc(c)}</td>`).join("")}</tr>`).join("") +
        `</tbody></table></div>
        <p class="small muted">세포 종류가 정확도를 가름 — 체세포 과변이가 적은 naive B 가 가장 높음. 실제 서열은 저장소에 넣지 않음.</p></div>

        <div>브라우저 엔진은 Python 도구를 JavaScript 로 옮긴 것. 같은 ${v.sequences} 서열에서 두 엔진의 결과를 글자 단위로 비교해 <strong>차이 0건</strong>.</div>
        <div>FR3 모티프 → 보존 Cys 거리 29 잔기: ${v.fr3Gap} (예외 14건은 모두 모티프가 엉뚱한 자리에 걸린 경우)</div>
