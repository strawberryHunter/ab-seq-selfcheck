      <section class="card guide"><h2>단축키</h2><dl>
        <dt><kbd>/</kbd></dt><dd>검색</dd><dt><kbd>Enter</kbd> <kbd>↓</kbd></dt><dd>검색 칸에서 첫 결과로</dd><dt><kbd>Esc</kbd></dt><dd>상세 · 메뉴 닫기</dd>
        <dt><kbd>←</kbd> <kbd>→</kbd></dt><dd>상세에서 이전 · 다음 후보</dd><dt><kbd>Ctrl</kbd> <kbd>Enter</kbd></dt><dd>분석</dd></dl></section>
      <section class="card guide"><h2>한계</h2><ul>${p.limitations.map((l) => `<li>${esc(l)}</li>`).join("")}<li><b>${esc(p.no_verdict)}</b></li></ul></section>
      <section class="card guide"><h2>저장 범위</h2><dl>
        <dt>로컬 처리</dt><dd>분석은 이 브라우저 안에서만 실행. 서열은 어디로도 전송되지 않음</dd>
        <dt>브라우저 저장</dt><dd>최근 분석 6건 · 규칙 세트 · 필터와 테마. 다른 사람에게 보이지 않음. 저장된 분석은 새 분석 화면에서 삭제. 너무 크거나 저장이 막혀 남기지 못한 분석은 '저장 안 됨' 표시</dd></dl></section>`;
  }

  /* ---------- sidebar ---------- */
  function renderSidebar() {
    const t = ABUI.tally(state.rows, state.picked);
    const nav = (v, label, n) => `<a class="nav" href="#${v}"${state.view === v ? ' aria-current="page"' : ""}>${label}${n === undefined ? "" : `<b>${n}</b>`}</a>`;
    const recent = recents().slice(0, 4);
    $("side").innerHTML = `
      <a class="brand" href="#all">${LOGO}AbCheck</a>
      <a class="cta" href="#new">+ 새 분석</a>
      <nav class="ngroup" aria-label="후보"><div class="slabel">후보</div>
        ${nav("all", "후보 전체", t.all)}${nav("review", "검토 필요", t.review)}${nav("unknown", "판정 불가", t.unknown)}${nav("errors", "입력 오류", t.errors)}${nav("picked", "고른 후보", t.picked)}</nav>
      <nav class="ngroup" aria-label="보기"><div class="slabel">보기</div>
        ${nav("compare", "CDR 비교")}${nav("properties", "물성 분포")}${nav("onepage", "한 장", t.picked)}</nav>
      <nav class="ngroup" aria-label="기준"><div class="slabel">기준</div>
        ${nav("rules", "선별 규칙", esc(rules().name))}${nav("validation", "검증 기록")}</nav>
      ${recent.length ? `<div class="ngroup"><div class="slabel">최근 분석</div>${recent.map((r, i) =>
        `<button class="nav rec" type="button" data-rec="${i}"><span>${esc(r.source)}</span><span class="sub num">${r.count}건 · ${whenShort(new Date(r.at))}</span></button>`).join("")}</div>` : ""}
      <div class="sfoot">${nav("guide", "사용법")}<p>개인 프로젝트 · 셀트리온과 무관</p></div>`;
  }
  function closeMenu() { $("side").classList.remove("on"); if (!$("sheet").classList.contains("on")) $("scrim").classList.remove("on"); }
  $("side").addEventListener("click", (ev) => {
    const b = ev.target.closest("[data-rec]");
    if (b) { const r = recents()[Number(b.dataset.rec)]; if (r) openRecent(r); }
    if (ev.target.closest("a, [data-rec]")) closeMenu();
  });
  $("menu").addEventListener("click", () => { $("side").classList.add("on"); $("scrim").classList.add("on"); });

  /* ---------- render + routing ---------- */
  let focusFirst = false;      // set by Enter / ArrowDown in the search field
  function render() {
    renderSidebar();
    const v = state.view;
    $("view").innerHTML = v === "new" ? viewNew() : LISTS[v] ? viewHome(v) : v === "compare" ? viewCompare()
      : v === "properties" ? viewProperties() : v === "onepage" ? viewOnepage() : v === "rules" ? viewRules()
      : v === "validation" ? viewValidation() : viewGuide();
    bind();
    if (focusFirst) { focusFirst = false; const hit = $("view").querySelector("[data-open]"); if (hit) hit.focus(); }
  }
  function go(view) { if (location.hash !== "#" + view) location.hash = view; else { state.view = view; render(); } }
  function route() {
    const h = (location.hash || "").replace(/^#/, "");
    const v = VIEWS.includes(h) ? h : !h && VIEWS.includes(ui.view) ? ui.view : "all";
    const changed = v !== state.view;
    state.view = v; state.limit = PAGE; state.tableLimit = 200;
    closeSheet(); closeMenu(); saveUi();
    render();
    if (changed) window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", route);

  const on = (id, type, fn) => { const el = $(id); if (el) el.addEventListener(type, fn); };
  function bind() {
    const view = $("view");
    view.querySelectorAll(".cand[data-i], tr.click").forEach((el) => el.addEventListener("click", (ev) => {
      if (ev.target.closest("button, a")) return;
      openSheet(Number(el.dataset.i), el.querySelector("[data-open]"));
    }));
    view.querySelectorAll("button[data-open]").forEach((b) => b.addEventListener("click", () => openSheet(Number(b.dataset.open), b)));
    view.querySelectorAll("[data-pick]").forEach((b) => b.addEventListener("click", () => togglePick(Number(b.dataset.pick))));
    view.querySelectorAll("[data-pick-pair]").forEach((b) => b.addEventListener("click", () => { const [h, l] = b.dataset.pickPair.split(",").map(Number); togglePair(h, l); }));
    view.querySelectorAll("[data-unit]").forEach((b) => b.addEventListener("click", () => { ui.unitChoice = b.dataset.unit; saveUi(); render(); }));
    view.querySelectorAll("[data-chain]").forEach((b) => b.addEventListener("click", () => { ui.chain = b.dataset.chain; saveUi(); render(); }));
    // home
    on("f-chain", "change", (e) => { ui.chain = e.target.value; saveUi(); render(); });
    on("f-conf", "change", (e) => { ui.conf = e.target.value; saveUi(); render(); });
    on("f-sort", "change", (e) => { ui.sort = e.target.value; saveUi(); render(); });
    on("f-reset", "click", () => { ui.chain = "all"; ui.conf = "all"; state.query = ""; $("q").value = ""; saveUi(); render(); });
    on("more", "click", () => { state.limit += PAGE; render(); });
    on("more-rows", "click", () => { state.tableLimit += 200; render(); });
    on("x-tsv", "click", () => copy(ABUI.toTsv(state.openList, rules().name), `표 ${state.openList.length}행 복사`));
    on("x-mail", "click", () => copy(ABUI.toMailText(state.rows, meta()), "메일용 글 복사"));
    on("x-fasta", "click", () => { const n = state.openList.filter((r) => r.inputOk).length; copy(ABUI.toFasta(state.openList), `FASTA ${n}건 복사`); });
    on("x-csv", "click", () => save(`abcheck-${stamp()}.csv`, ABUI.toCsv(state.openList, rules().name), "text/csv"));
    on("x-json", "click", () => save(`abcheck-${stamp()}.json`, ABCHECK.toJSON(ABUI.withRuleResults(state.payload, rules())), "application/json"));
    const slideCount = () => heroSlides(ABUI.tally(state.rows)).length;
    on("hero-prev", "click", () => { const n = slideCount(); state.hero = (Math.min(state.hero, n - 1) + n - 1) % n; render(); $("hero-prev").focus(); });
    on("hero-next", "click", () => { const n = slideCount(); state.hero = (Math.min(state.hero, n - 1) + 1) % n; render(); $("hero-next").focus(); });
    on("hero-clear", "click", () => { state.payload = null; state.rows = []; state.picked = new Set(); state.isExample = false; render(); const ta = $("hero-input"); if (ta) ta.focus(); });
    on("hero-run", "click", () => analyzeText($("hero-input").value, "", state.ph));
    on("hero-input", "keydown", (ev) => { if (ev.key === "Enter" && (ev.ctrlKey || ev.metaKey)) { ev.preventDefault(); analyzeText(ev.target.value, "", state.ph); } });
    on("hero-file", "change", (ev) => { analyzeFiles(ev.target.files, state.ph); ev.target.value = ""; });
    on("hero-example", "click", loadExample);
    bindDrop($("hero-input"));
    if (state.view === "new") bindNew();
    // one page
    // a meeting discusses antibodies, so a flagged chain brings its partner chain along
    on("op-add", "click", () => {
      let partners = 0;
      state.rows.forEach((r) => {
        if (r.cats[0] !== "review") return;
        state.picked.add(r.index);
        const p = state.pairs[r.index];
        if (p !== undefined && state.rows[p].cats[0] !== "review" && !state.picked.has(p)) { state.picked.add(p); partners += 1; }
      });
      savePicked(); render();
      if (partners) toast(`짝 체인 ${partners}건 함께 넣음`);
    });
    on("op-pair", "click", () => { state.openList.forEach((r) => { const p = state.pairs[r.index]; if (p !== undefined) state.picked.add(p); }); savePicked(); render(); });
    on("op-clear", "click", () => { state.picked = new Set(); savePicked(); render(); });
    on("op-tsv", "click", () => copy(ABUI.toTsv(state.openList, rules().name), `표 ${state.openList.length}행 복사`));
    on("op-save", "click", () => save(`abcheck-onepage-${stamp()}.html`, ABUI.onePageDoc(state.openList, meta()), "text/html"));
    if (state.view === "rules") bindRules();
    const fig = $("fig");
    if (fig) bindFigure(fig);
  }

  function bindDrop(ta) {
    if (!ta) return;
    ta.addEventListener("dragover", (ev) => { ev.preventDefault(); ta.classList.add("drag"); });
    ta.addEventListener("dragleave", () => ta.classList.remove("drag"));
    ta.addEventListener("drop", (ev) => {
      ev.preventDefault(); ta.classList.remove("drag");
      analyzeFiles(ev.dataTransfer && ev.dataTransfer.files, parseFloat(($("ph") || {}).value) || state.ph);
    });
  }
  function loadExample() { analyzeText(EXAMPLE, "", 7.4, { example: true }); }
  function bindNew() {
    const ta = $("input");
    const detect = () => {
      const out = $("detect");
      if (!out || !document.contains(ta)) return;      // the debounce can fire after this screen was left
      if (!ta.value.trim()) { out.textContent = ""; return; }
      try { const [entries, source] = readText(ta.value, state.fileName); out.textContent = `${source} · 서열 ${entries.length}개`; }
      catch (e) { out.textContent = "읽을 수 없는 형식"; }
    };
    const start = () => analyzeText(ta.value, state.fileName, parseFloat($("ph").value));
    on("strip", "click", () => { ta.value = ABUI.stripNumbering(ta.value).text; analyzeText(ta.value, "", parseFloat($("ph").value)); });
    let timer = 0;
    ta.addEventListener("input", () => { state.input = ta.value; state.fileName = ""; clearTimeout(timer); timer = setTimeout(detect, 200); });
    ta.addEventListener("keydown", (ev) => { if (ev.key === "Enter" && (ev.ctrlKey || ev.metaKey)) { ev.preventDefault(); start(); } });
    bindDrop(ta);
    on("file", "change", (ev) => { analyzeFiles(ev.target.files, parseFloat($("ph").value) || state.ph); ev.target.value = ""; });
    on("run", "click", start);
    on("example", "click", loadExample);
    on("clear", "click", () => { state.input = ""; state.fileName = ""; state.error = null; state.rejected = null; render(); $("input").focus(); });
    $("view").querySelectorAll("[data-load]").forEach((b) => b.addEventListener("click", () => {
      const r = recents()[Number(b.dataset.load)];
      if (!r) return;
      state.input = recentText(r); state.fileName = ""; state.error = null; state.rejected = null; state.ph = r.ph;
      render(); $("input").focus();
    }));
    // sequences of an analysis stay in this browser until removed here (or pushed out by six newer ones)
    $("view").querySelectorAll("[data-forget]").forEach((b) => b.addEventListener("click", () => {
      const list = recents(), at = Number(b.dataset.forget), r = list[at];
      if (!r) return;
      list.splice(at, 1);
      store.set(K.recent, list);
      const wasOpen = state.recentId === r.id;
      if (wasOpen) state.recentId = null;
      render();
      toast(`${r.source} 삭제`, "되돌리기", () => {
        const now = recents();
        now.splice(Math.min(at, now.length), 0, r);
        store.set(K.recent, now.slice(0, 6));
        if (wasOpen) state.recentId = r.id;
        render();
      });
    }));
    detect();
  }

  function bindRules() {
    const changed = () => { saveRules(); retriage(); render(); };
    const editable = () => state.rules.sets.find((s) => s.id === state.rules.active);
    on("r-set", "change", (e) => { state.rules.active = e.target.value; changed(); });
    on("r-copy", "click", () => {
      const base = rules();
      let n = 1, name;
      do { name = (base.id === "default" ? "내 규칙" : base.name) + " " + n++; } while (state.rules.sets.some((s) => s.name === name));
      const copyOf = ABUI.normalizeRuleSet(Object.assign({}, base, { id: "s" + Date.now(), name }));
      state.rules.sets.push(copyOf); state.rules.active = copyOf.id;
      changed(); toast(`${name} 만듦`);
      const input = $("r-name"); if (input) { input.focus(); input.select(); }
    });
    // hand a rule set to a colleague: one line of text out, a paste in
    on("r-share", "click", () => copy(ABUI.ruleSetToText(rules()), `${rules().name} 규칙 복사`));
    const takeIn = () => {
      const box = $("r-paste");
      if (!box.value.trim()) { box.focus(); return toast("복사한 규칙 붙여넣기 필요"); }
      let got;
      try { got = ABUI.ruleSetFromText(box.value); }
      catch (e) { console.warn("abcheck: pasted rule set refused", e); box.focus(); box.select(); return toast("규칙으로 읽을 수 없음"); }
      const taken = [ABUI.DEFAULT_RULESET].concat(state.rules.sets).map((s) => s.name);
      let name = got.name, n = 2;
      while (taken.includes(name)) name = `${got.name} ${n++}`;
      const rs = ABUI.normalizeRuleSet(Object.assign({}, got, { id: "s" + Date.now(), name }));
      state.rules.sets.push(rs); state.rules.active = rs.id;
      changed(); toast(`${name} 가져옴`);
    };
    on("r-import", "click", takeIn);
    on("r-paste", "keydown", (ev) => { if (ev.key === "Enter") { ev.preventDefault(); takeIn(); } });
    on("r-del", "click", () => {
      const rs = editable(); if (!rs) return;
      const at = state.rules.sets.indexOf(rs);
      state.rules.sets = state.rules.sets.filter((s) => s.id !== rs.id); state.rules.active = "default";
      changed();
      toast(`${rs.name} 삭제`, "되돌리기", () => { state.rules.sets.splice(at, 0, rs); state.rules.active = rs.id; changed(); });
    });
    on("r-name", "change", (e) => {
      const rs = editable(); if (!rs) return;
      const name = e.target.value.trim();
      if (!name) { e.target.value = rs.name; return toast("이름이 비어 있음"); }
      rs.name = name; saveRules(); render();
    });
    $("view").querySelectorAll("[data-motif]").forEach((b) => b.addEventListener("click", () => {
      const rs = editable(); if (!rs) return;
      const p = b.dataset.motif;
      rs.motifs = rs.motifs.includes(p) ? rs.motifs.filter((x) => x !== p) : rs.motifs.concat([p]);
      Object.assign(rs, ABUI.normalizeRuleSet(rs));
      changed();
    }));
    $("view").querySelectorAll("[data-rule]").forEach((b) => b.addEventListener("click", () => {
      const rs = editable(); if (!rs) return;
      rs[b.dataset.rule] = b.dataset.val;
      changed();
    }));
  }

  function bindFigure(fig) {
    const old = fig.querySelector("svg");
    if (old) old.remove();
    figWidth = fig.clientWidth;
    fig.insertAdjacentHTML("afterbegin", scatter(figRows, figWidth));
    const tip = $("tip"), svg = fig.querySelector("svg");
    const show = (g) => {
      const r = state.rows[Number(g.dataset.open)];
      const k = svg.getBoundingClientRect().width / Number(svg.viewBox.baseVal.width);
      const x = Number(g.dataset.x), y = Number(g.dataset.y);
      const same = fig.querySelectorAll(".pt").length > 1 ? [...fig.querySelectorAll(".pt")].filter((o) => Math.abs(Number(o.dataset.x) - x) < 1 && Math.abs(Number(o.dataset.y) - y) < 1).length : 1;
      tip.innerHTML = `<b class="mono">${esc(r.id)}</b> · ${chainText(r)}${same > 1 ? ` · 같은 자리 ${same}건` : ""}<br>pI ${fmt(r.pI, 2)} · GRAVY ${fmt(r.gravy, 3)} · net charge ${signed(r.charge)}`;
      tip.style.left = (x * k) + "px"; tip.style.top = (y * k) + "px";
      tip.hidden = false;
    };
    const groups = [...fig.querySelectorAll(".pt")];
    const pts = groups.map((g) => ({ x: Number(g.dataset.x), y: Number(g.dataset.y) }));
    let active = null;
    const mark = (g) => {
      if (active === g) { if (!g) tip.hidden = true; return; }      // moving away also clears a name shown by focus
      if (active) active.classList.remove("on");
      active = g;
      svg.classList.toggle("near", !!g);
      if (g) { g.classList.add("on"); show(g); } else tip.hidden = true;
    };
    // the point nearest the pointer answers, within a finger's or a cursor's reach
    const under = (ev) => {
      const box = svg.getBoundingClientRect(), k = Number(svg.viewBox.baseVal.width) / box.width;
      const i = ABUI.nearestPoint(pts, (ev.clientX - box.left) * k, (ev.clientY - box.top) * k, ev.pointerType === "touch" ? 24 : 14);
      return i < 0 ? null : groups[i];
    };
    svg.addEventListener("pointermove", (ev) => mark(under(ev)));
    svg.addEventListener("pointerleave", () => mark(null));
    svg.addEventListener("click", (ev) => { const g = under(ev); if (g) openSheet(Number(g.dataset.open), g); });
    groups.forEach((g) => {
      g.addEventListener("focus", () => show(g)); g.addEventListener("blur", () => { tip.hidden = true; });
      g.addEventListener("keydown", (ev) => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); openSheet(Number(g.dataset.open), g); } });
    });
  }

  /* ---------- drawer, search, keyboard, theme ---------- */
  $("sheet-close").innerHTML = icon("x");
  $("sheet-pick").innerHTML = icon("bookmark");
  $("menu").innerHTML = icon("menu");
  $("q-ic").innerHTML = icon("search", 16);
  $("sheet-close").addEventListener("click", closeSheet);
  $("scrim").addEventListener("click", () => { closeSheet(); closeMenu(); });
  $("sheet-prev").addEventListener("click", () => stepSheet(-1));
  $("sheet-next").addEventListener("click", () => stepSheet(1));
  $("sheet-pick").addEventListener("click", () => { if (state.open !== null) togglePick(state.open); });
  $("sheet-copy").addEventListener("click", () => { const r = state.rows[state.open]; if (r) copy(ABUI.toFasta([r]), `${r.id} FASTA 복사`); });
  document.addEventListener("keydown", (ev) => {
    const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
    if (ev.key === "Escape") { closeSheet(); closeMenu(); if (document.activeElement === $("q")) $("q").blur(); return; }
    if (ev.key === "/" && !typing && !ev.ctrlKey && !ev.metaKey) { ev.preventDefault(); $("q").focus(); return; }
    if (ev.key === "Tab" && $("sheet").classList.contains("on")) {
      const els = [...$("sheet").querySelectorAll("button, a[href], input, select")].filter((e) => !e.disabled && e.offsetParent !== null);
      const cur = document.activeElement, last = els[els.length - 1];
      // only the edges are handled: inside the drawer the browser's own order applies (it also stops on the scrolling body)
      if (els.length && (!$("sheet").contains(cur) || (ev.shiftKey && cur === els[0]) || (!ev.shiftKey && cur === last))) {
        ev.preventDefault(); (ev.shiftKey ? last : els[0]).focus();
      }
      return;
    }
    if (!$("sheet").classList.contains("on") || typing) return;
    if (ev.key === "ArrowRight" || ev.key === "ArrowDown") { ev.preventDefault(); stepSheet(1); }
    else if (ev.key === "ArrowLeft" || ev.key === "ArrowUp") { ev.preventDefault(); stepSheet(-1); }
  });
  let resizeTimer = 0;
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { const fig = $("fig"); if (fig && fig.clientWidth !== figWidth) bindFigure(fig); }, 150);
  });
  let qTimer = 0;
  const applyQuery = () => {
    state.query = $("q").value; state.limit = PAGE;
    if (LISTS[state.view] || state.view === "compare" || state.view === "properties") render(); else go("all");
  };
  $("q").addEventListener("input", () => { clearTimeout(qTimer); qTimer = setTimeout(applyQuery, 150); });
  $("q").addEventListener("keydown", (ev) => {
    if (ev.key !== "Enter" && ev.key !== "ArrowDown") return;
    ev.preventDefault();
    clearTimeout(qTimer);
    focusFirst = true;          // render() moves the focus to the first result
    applyQuery();
  });

  const THEMES = [["light", "sun", "라이트"], ["dark", "moon", "다크"], ["system", "monitor", "시스템"]];
  function applyTheme(mode) {
    if (mode === "system") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", mode);
    $("theme").innerHTML = THEMES.map(([k, ic, l]) => `<button type="button" data-theme-set="${k}" aria-pressed="${k === mode}" aria-label="${l} 테마" title="${l}">${icon(ic, 16)}</button>`).join("");
  }
  $("theme").addEventListener("click", (ev) => {
    const b = ev.target.closest("[data-theme-set]");
    if (!b) return;
    store.set(K.theme, b.dataset.themeSet); applyTheme(b.dataset.themeSet);
  });
  const savedTheme = store.get(K.theme, "system");
  applyTheme(["light", "dark", "system"].includes(savedTheme) ? savedTheme : "system");

  const opCss = document.createElement("style");
  opCss.textContent = ABUI.ONE_PAGE_CSS.replace(/@page\{[^}]*\}/, "");
  document.head.appendChild(opCss);

  /* ---------- start: the last analysis if there is one, otherwise the synthetic example ---------- */
  loadRules();
  const last = recents()[0];
  let started = false;
  if (last) {
    try { started = analyzeEntries(last.entries, last.source, last.ph, { recentId: last.id, picked: last.picked, at: last.at }); }
    catch (e) { console.error("abcheck: the stored last analysis could not be restored", e); }
  }
  if (!started) {
    const [entries, source] = readText(EXAMPLE, "");
    if (!analyzeEntries(entries, source, 7.4, { example: true })) console.error("abcheck: the built-in example failed to analyse", state.rejected);
  }
  route();
  if (store.unreadable.size) note("브라우저 저장값을 읽지 못함");
})();
</script>
