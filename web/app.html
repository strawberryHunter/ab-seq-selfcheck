<title>AbCheck 항체 서열 점검</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/*__FONTS__*/
/* Layout: app shell shared by the portfolio series — 260px sidebar (name, one primary
   action, counted menus), top bar (search, principle chips, theme), then hero card,
   title, clickable stat line, filter row, 3-column cards, and a detail drawer from the
   right. Green is brand/action only. Risk is always text, never a color: no verdicts. */
:root {
  --bg: #F7F9F8;
  --card: #FFFFFF;
  --field: #FFFFFF;
  --line: #E3E8E6;
  --text: #1A1F1C;
  --muted: #5A6469;
  --brand: #00733C;
  --brand-strong: #00552D;
  --brand-tint: #EAF7EE;
  --on-brand: #FFFFFF;
  --accent: #00466E;
  --bright: #00CD00;
  --cdr: #E1ECF4;
  --vh: #1A6CA8;
  --vl: #D9622B;
  --scrim: rgba(15, 20, 18, 0.45);
  --ff: "Pretendard", system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --fm: ui-monospace, SFMono-Regular, Menlo, Consolas, "D2Coding", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1412; --card: #171D1A; --field: #121815; --line: #2A332F; --text: #E8EEEA; --muted: #9BA7A1;
    --brand: #5FE65A; --brand-strong: #8AF086; --brand-tint: #16301F; --on-brand: #0F1412;
    --accent: #7FB6DE; --bright: #00CD00; --cdr: #1B2E3B; --vh: #4590D0; --vl: #E26A38;
    --scrim: rgba(0, 0, 0, 0.6); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1412; --card: #171D1A; --field: #121815; --line: #2A332F; --text: #E8EEEA; --muted: #9BA7A1;
  --brand: #5FE65A; --brand-strong: #8AF086; --brand-tint: #16301F; --on-brand: #0F1412;
  --accent: #7FB6DE; --bright: #00CD00; --cdr: #1B2E3B; --vh: #4590D0; --vl: #E26A38;
  --scrim: rgba(0, 0, 0, 0.6); color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: var(--ff); font-size: 15px; font-weight: 400; line-height: 1.55;
  word-break: keep-all; -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--bg); }
button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
button { cursor: pointer; line-height: inherit; }
a { color: var(--brand); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3 { margin: 0; line-height: 1.3; font-weight: 700; }
p { margin: 0; }
.mono { font-family: var(--fm); }
.muted { color: var(--muted); }
.s13 { font-size: 13px; }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ic { display: block; flex: none; }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: 260px minmax(0, 1fr); min-height: 100vh; }
.side {
  position: sticky; top: env(safe-area-inset-top, 0px); align-self: start; z-index: 45;
  height: calc(100vh - env(safe-area-inset-top, 0px)); overflow: auto;
  background: var(--card); border-right: 1px solid var(--line);
  padding: 20px 12px 16px; padding-left: max(12px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 14px;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 0 8px; text-decoration: none; color: var(--text); font-size: 19px; font-weight: 700; }
.cta {
  display: flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none;
  padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card);
  color: var(--brand); font-weight: 700;
}
.cta:hover { border-color: var(--brand); }
.ngroup { display: grid; gap: 2px; }
.slabel { font-size: 13px; color: var(--muted); padding: 8px 12px 4px; }
.nav {
  position: relative; display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
  border: none; background: none; text-decoration: none;
  padding: 8px 12px; border-radius: 10px; color: var(--text);
}
.nav b { margin-left: auto; font-size: 13px; font-weight: 400; color: var(--muted); font-variant-numeric: tabular-nums; }
.nav:hover { background: var(--bg); }
.nav[aria-current="page"] { background: var(--brand-tint); font-weight: 700; }
.nav[aria-current="page"]::before { content: ""; position: absolute; left: 0; top: 6px; bottom: 6px; width: 3px; border-radius: 2px; background: var(--brand); }
.nav .sub { display: block; font-size: 13px; color: var(--muted); font-weight: 400; }
.nav.rec { display: block; }
.nav.rec span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sfoot { margin-top: auto; display: grid; gap: 6px; padding-top: 10px; border-top: 1px solid var(--line); }
.sfoot p { font-size: 13px; color: var(--muted); padding: 0 12px; }

.mainwrap { min-width: 0; display: flex; flex-direction: column; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); border-bottom: 1px solid var(--line); }
.inner {
  max-width: 1180px; width: 100%; margin: 0 auto;
  padding-left: max(24px, env(safe-area-inset-left, 0px));
  padding-right: max(24px, env(safe-area-inset-right, 0px));
}
.topin { display: flex; align-items: center; gap: 10px; padding-block: 10px; flex-wrap: wrap; }
.search { flex: 1 1 220px; min-width: 0; position: relative; display: block; }
.search .ic { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.search input { width: 100%; border: 1px solid var(--line); background: var(--field); border-radius: 10px; padding: 9px 12px 9px 38px; outline: none; }
.search input:focus { border-color: var(--brand); }
.chips { display: flex; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; font-size: 13px; padding: 3px 10px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--card); color: var(--muted); text-decoration: none; white-space: nowrap;
}
.chip.dot::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--bright); }
a.chip:hover, button.chip:hover { border-color: var(--brand); color: var(--text); }
.iconbtn { flex: none; width: 38px; height: 38px; display: grid; place-items: center; border: 1px solid var(--line); background: var(--card); border-radius: 10px; color: var(--text); }
.iconbtn:hover { border-color: var(--brand); }
.menu { display: none; }
main { padding-block: 24px 72px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; align-content: start; }

/* ---------- controls ---------- */
.btn {
  display: inline-flex; align-items: center; gap: 6px; text-decoration: none; white-space: nowrap;
  border: 1px solid var(--line); background: var(--card); color: var(--text);
  border-radius: 10px; padding: 8px 14px; font-weight: 700;
}
.btn:hover { border-color: var(--brand); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
.btn.primary:hover { background: var(--brand-strong); border-color: var(--brand-strong); }
.btn.big { font-size: 17px; padding: 13px 22px; }
.btn:disabled { opacity: 0.45; cursor: default; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--card); }
.seg > * { border: none; background: none; padding: 8px 12px; color: var(--muted); text-decoration: none; border-left: 1px solid var(--line); white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
.seg > *:first-child { border-left: none; }
.seg > [aria-pressed="true"], .seg > [aria-current="true"] { background: var(--brand-tint); color: var(--text); font-weight: 700; }
.seg > :disabled { opacity: 0.45; cursor: default; }
.seg b { font-weight: 400; font-variant-numeric: tabular-nums; }
select, input[type="text"], input[type="number"] { border: 1px solid var(--line); background: var(--field); border-radius: 10px; padding: 8px 10px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; min-width: 0; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.spacer { margin-left: auto; }
.tag { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 13px; font-weight: 700; white-space: nowrap; border: 1px solid var(--text); color: var(--text); }
.tag.review { background: var(--text); color: var(--card); }
.tag.unknown, .tag.errors { border-style: dashed; }
.tag.clear { border-color: var(--line); color: var(--muted); font-weight: 400; }
.chain { flex: none; font-family: var(--fm); font-size: 13px; font-weight: 700; border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; color: var(--muted); }
.blank { border: 1px dashed var(--line); border-radius: 16px; padding: 36px 20px; text-align: center; color: var(--muted); display: grid; gap: 12px; justify-items: center; }
.busy { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; background: var(--scrim); }
.busy div { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px 26px; font-weight: 700; }

/* ---------- home ---------- */
.hero { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px 24px; align-items: center; padding: 22px 24px; }
.hero h2 { font-size: 24px; margin-top: 8px; }
.hero .why { color: var(--muted); margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hero .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin-top: 10px; font-size: 13px; color: var(--muted); }
.hero .wide { grid-column: 1 / -1; min-width: 0; }
.badge { display: inline-block; font-size: 13px; font-weight: 700; padding: 2px 10px; border-radius: 999px; background: var(--brand-tint); color: var(--brand-strong); }
.hnav { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.hnav .iconbtn { width: 30px; height: 30px; }
.dots { display: flex; gap: 5px; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--brand); width: 16px; border-radius: 3px; }
.hero textarea { min-height: 120px; }
.titlebar { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 10px; }
.titlebar h1 { font-size: 24px; }
.titlebar .cnt { font-size: 17px; color: var(--muted); }
.titlebar .row { margin-left: auto; }
.stats { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 18px; }
.stat { display: inline-flex; align-items: baseline; gap: 6px; text-decoration: none; color: var(--muted); padding: 2px 0; border-bottom: 2px solid transparent; }
.stat b { font-size: 17px; color: var(--text); font-variant-numeric: tabular-nums; }
.stat:hover b { color: var(--brand); }
.stat[aria-current="true"] { border-bottom-color: var(--brand); color: var(--text); }
.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.cand { display: grid; gap: 8px; cursor: pointer; align-content: start; }
.cand:hover { border-color: var(--brand); }
.chead { display: flex; align-items: center; gap: 8px; min-width: 0; }
.cname { border: none; background: none; padding: 0; font-family: var(--fm); font-weight: 700; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.pick { margin-left: auto; flex: none; border: none; background: none; padding: 4px; border-radius: 6px; color: var(--muted); }
.pick:hover { color: var(--brand); }
.pick[aria-pressed="true"] { color: var(--brand); }
.pick[aria-pressed="true"] .ic { fill: currentColor; }
.ctitle { font-size: 17px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-all; }
.ctitle.why { font-size: 15px; word-break: keep-all; color: var(--muted); }
.csub { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.csub.seq { font-family: var(--fm); }
.ctitle.seq { font-family: var(--fm); }
.ctitle .k { font-family: var(--ff); font-size: 13px; color: var(--muted); margin-right: 8px; }
.cstate { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cfoot { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.cfoot .s13 { color: var(--muted); }
.cand.ab { cursor: default; }
.abrow { display: grid; gap: 4px; width: 100%; min-width: 0; border: none; background: none; padding: 0; text-align: left; cursor: pointer; }
.abrow + .abrow { border-top: 1px solid var(--line); padding-top: 8px; }
.abtop { display: flex; align-items: center; gap: 8px; min-width: 0; }
.abrow:hover .abseq.seq { color: var(--brand); }
.abseq { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
.abseq.seq { font-family: var(--fm); font-size: 17px; color: var(--text); }
.abseq .k { font-family: var(--ff); font-size: 13px; color: var(--muted); margin-right: 8px; }
.cfoot .row { flex-wrap: nowrap; }
u.m { text-decoration: underline 2px; text-underline-offset: 3px; text-decoration-color: currentColor; cursor: help; }

/* ---------- tables ---------- */
.scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; min-width: 0; }
table { border-collapse: collapse; width: 100%; }
th { text-align: left; font-size: 13px; font-weight: 400; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
tbody tr:last-child td { border-bottom: none; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
td.nw { white-space: nowrap; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--bg); }
.seqcell { font-family: var(--fm); white-space: nowrap; }
.seqcell small { font-family: var(--ff); font-size: 13px; color: var(--muted); margin-left: 6px; }
.rowlink { border: none; background: none; padding: 0; font-family: var(--fm); font-weight: 700; white-space: nowrap; }
.rowlink:hover { color: var(--brand); }

/* ---------- drawer ---------- */
.scrim { position: fixed; inset: 0; background: var(--scrim); opacity: 0; pointer-events: none; transition: opacity 0.16s; z-index: 44; }
.scrim.on { opacity: 1; pointer-events: auto; }
#sheet {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(640px, 100vw); z-index: 51;
  background: var(--card); border-left: 1px solid var(--line); display: flex; flex-direction: column;
  transform: translateX(101%); visibility: hidden; transition: transform 0.2s ease, visibility 0s linear 0.2s;
}
#sheet.on { transform: none; visibility: visible; transition: transform 0.2s ease; }
.sh { display: grid; gap: 8px; padding: 16px 20px 14px; padding-top: calc(16px + env(safe-area-inset-top, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); }
.sh h2 { font-family: var(--fm); font-size: 19px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.sh .chead .iconbtn { width: 34px; height: 34px; }
.sb { flex: 1; overflow: auto; padding: 4px 20px 24px; padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.sf { display: flex; gap: 8px; align-items: center; border-top: 1px solid var(--line); padding: 10px 20px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.sf .pos { margin-right: auto; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.blk { margin-top: 20px; display: grid; gap: 8px; min-width: 0; }
.blk h3 { font-size: 13px; color: var(--muted); font-weight: 700; }
.blk ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--muted); }
.legend .c { background: var(--cdr); font-family: var(--fm); padding: 0 4px; border-radius: 3px; color: var(--text); }
.ruler { margin: 0; font-family: var(--fm); font-size: 13px; line-height: 1.8; white-space: pre; }
.ruler .p, .ruler .l { color: var(--muted); }
.ruler .l { font-family: var(--ff); }
.ruler .c { background: var(--cdr); font-weight: 700; }
.why2 { display: block; font-size: 13px; color: var(--muted); margin-top: 2px; }

/* ---------- other screens ---------- */
textarea {
  width: 100%; min-height: 240px; resize: vertical; padding: 12px;
  font-family: var(--fm); font-size: 13px; line-height: 1.55;
  background: var(--field); color: var(--text); border: 1px solid var(--line); border-radius: 10px;
}
textarea:focus { outline: none; border-color: var(--brand); }
textarea.drag { border-style: dashed; border-color: var(--brand); }
textarea[aria-invalid="true"] { border-color: var(--text); }
.filebtn { position: relative; }
.filebtn input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.field { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
.field input[type="number"] { width: 5em; color: var(--text); }
.err { border-left: 3px solid var(--text); padding-left: 12px; display: grid; gap: 4px; }
.err b { font-weight: 700; }
.form { display: grid; gap: 14px; }
.form .frow { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 10px; align-items: center; }
.form .frow > span { color: var(--muted); font-size: 13px; }
#r-paste { flex: 1 1 120px; min-width: 0; max-width: 360px; }
.toggles { display: flex; flex-wrap: wrap; gap: 6px; }
.toggle { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 6px 10px; color: var(--muted); }
.toggle[aria-pressed="true"] { background: var(--brand-tint); color: var(--text); font-weight: 700; border-color: var(--brand); }
.toggle:disabled { cursor: default; opacity: 0.7; }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.tile { display: grid; gap: 4px; align-content: start; }
.tile b { font-size: 32px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.tile span { color: var(--muted); }
.tile i { font-style: normal; font-size: 13px; color: var(--muted); }
.figure { position: relative; }
.figure svg { display: block; width: 100%; height: auto; }
.figure .gl line { stroke: var(--line); stroke-width: 1; }
.figure text { fill: var(--muted); font-size: 13px; font-family: var(--ff); }
.figure text.lab { fill: var(--text); font-family: var(--fm); }
.figure .pt { outline: none; }
.figure svg.near { cursor: pointer; }
.figure .pt .mh { fill: var(--vh); stroke: var(--card); stroke-width: 2; }
.figure .pt .ml { fill: var(--vl); stroke: var(--card); stroke-width: 2; }
.figure .pt.on .mh, .figure .pt.on .ml, .figure .pt:focus-visible .mh, .figure .pt:focus-visible .ml { stroke: var(--text); }
.tip { position: absolute; pointer-events: none; z-index: 5; background: var(--text); color: var(--card); border-radius: 10px; padding: 8px 10px; font-size: 13px; white-space: nowrap; transform: translate(-50%, calc(-100% - 12px)); }
.key { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.paper { background: #FFFFFF; border: 1px solid var(--line); border-radius: 16px; padding: 20px; overflow-x: auto; }
.paper .op { min-width: 900px; }
.guide { display: grid; gap: 12px; }
.guide h2 { font-size: 17px; }
.guide dl { margin: 0; display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 6px 14px; }
.guide dt { color: var(--muted); }
.guide dd { margin: 0; }
.guide ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
kbd { font-family: var(--fm); font-size: 13px; border: 1px solid var(--line); border-radius: 6px; padding: 0 5px; background: var(--card); }

.only-narrow { display: none; }
.toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 12px); z-index: 90;
  background: var(--text); color: var(--card); border-radius: 10px; padding: 10px 16px; font-weight: 700;
  opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s; max-width: calc(100vw - 32px);
}
.toast.on { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.toast button { margin-left: 12px; border: 1px solid currentColor; background: none; color: inherit; border-radius: 10px; padding: 2px 10px; font-weight: 700; }

@media (pointer: coarse), (max-width: 768px) {
  .pick { padding: 10px; margin: -6px -6px -6px auto; }
  button.chip { min-height: 34px; }
}
#sheet.on ~ .toast { bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
@media (max-width: 1024px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { position: fixed; top: 0; left: 0; bottom: 0; width: min(280px, 86vw); height: auto; transform: translateX(-101%); visibility: hidden; transition: transform 0.2s ease, visibility 0s linear 0.2s; padding-top: calc(20px + env(safe-area-inset-top, 0px)); }
  .side.on { transform: none; visibility: visible; transition: transform 0.2s ease; }
  .menu { display: grid; }
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 768px) {
  .only-narrow { display: block; }
  .wide-only { display: none; }
  .inner { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .grid { grid-template-columns: minmax(0, 1fr); }
  .hero { grid-template-columns: minmax(0, 1fr); padding: 18px; }

<script>
(function () {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const esc = ABUI.esc;
  const fmt = (v, d) => (v === null || v === undefined ? "-" : Number(v).toFixed(d));
  const signed = (v) => (v === null || v === undefined ? "-" : (v > 0 ? "+" : "") + Number(v).toFixed(2));

  /* Synthetic examples from data/synthetic/sequences.json — no real antibody sequences. */
  const EXAMPLE = /*__EXAMPLE__*/"";

  /* One icon set: 24-grid outline icons, 1.8 stroke. */
  const PATHS = {
    search: '<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
    menu: '<path d="M4 6h16M4 12h16M4 18h16"/>',
    x: '<path d="M18 6L6 18M6 6l12 12"/>',
    sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
    moon: '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',
    monitor: '<rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/>',
    bookmark: '<path d="M19 21l-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>',
    arrow: '<path d="M5 12h14M13 6l6 6-6 6"/>',
    left: '<path d="M15 18l-6-6 6-6"/>',
    right: '<path d="M9 18l6-6-6-6"/>'
  };
  const icon = (name, size) => `<svg class="ic" width="${size || 18}" height="${size || 18}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${PATHS[name]}</svg>`;
  const LOGO = '<svg class="ic" width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><rect width="30" height="30" rx="8" fill="var(--brand)"/><path d="M15 24v-9M15 15L9 8.5M15 15l6-6.5" stroke="var(--on-brand)" stroke-width="2.6" stroke-linecap="round" fill="none"/></svg>';

  const VIEWS = ["new", "all", "review", "unknown", "clear", "errors", "picked", "compare", "properties", "onepage", "rules", "validation", "guide"];
  const LISTS = { all: "후보 전체", review: "검토 필요", unknown: "판정 불가", clear: "기준 해당 없음", errors: "입력 오류", picked: "고른 후보" };
  const PAGE = 60;

  /* ---------- browser storage: per-viewer conveniences only ---------- */
  const store = {
    unreadable: new Set(),      // keys that could not be read (storage blocked, or a value cut short); the user is told at start
    get(key, fallback) {
      try { const v = localStorage.getItem(key); return v === null ? fallback : JSON.parse(v); }
      catch (e) { store.unreadable.add(key); console.warn("abcheck: could not read " + key + " from browser storage", e); return fallback; }
    },
    set(key, value) {
      try { localStorage.setItem(key, JSON.stringify(value)); return true; }
      catch (e) { console.warn("abcheck: could not save " + key + " to browser storage", e); return false; }
    }
  };
  const K = { recent: "abcheck.recent.v2", theme: "abcheck.theme.v2", ui: "abcheck.ui.v1", rules: "abcheck.rules.v1" };

  const ui = ABUI.cleanUi(store.get(K.ui, null), VIEWS);
  const unitNow = () => ui.unitChoice || ABUI.preferredUnit(state.rows, state.pairs);
  const state = {
    payload: null, rows: [], source: "", ph: 7.4, at: null, isExample: false, recentId: null,
    view: "all", query: "", limit: PAGE, tableLimit: 200, hero: 0, picked: new Set(),
    input: "", fileName: "", error: null, rejected: null,
    rules: { active: "default", sets: [] }, pairs: {},
    open: null, openList: [], opener: null
  };
  const saveUi = () => store.set(K.ui, { chain: ui.chain, conf: ui.conf, sort: ui.sort, unitChoice: ui.unitChoice, view: state.view });

  /* ---------- toast, clipboard, files ---------- */
  let toastTimer = 0;
  function toast(msg, action, fn) {
    const t = $("toast");
    t.textContent = msg;
    if (action) {
      const b = document.createElement("button");
      b.type = "button"; b.textContent = action;
      b.addEventListener("click", () => { t.classList.remove("on"); fn(); });
      t.appendChild(b);
    }
    t.classList.add("on");
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("on"), action ? 6000 : 2800);
  }
  /**
   * Copy text and say so. The selection-based copy runs first: it happens inside the click and
   * also works where the page sits in a frame that may not use the async clipboard (there every
   * copy used to end in "press Ctrl+C yourself"). The async clipboard is the second try; only
   * when both are refused is the text left selected for the user to copy by hand.
   */
  function copy(text, done) {
    const from = document.activeElement;
    const ta = document.createElement("textarea");
    ta.value = text; ta.setAttribute("readonly", ""); ta.setAttribute("aria-hidden", "true");
    ta.style.position = "fixed"; ta.style.top = "0"; ta.style.left = "0"; ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select(); ta.setSelectionRange(0, text.length);
    let ok = false;
    try { ok = document.execCommand("copy"); }
    catch (e) { console.warn("abcheck: selection-based copy failed", e); }
    const finish = () => { ta.remove(); if (from && document.contains(from)) from.focus(); toast(done); };
    if (ok) { finish(); return; }
    const byHand = (err) => {
      console.warn("abcheck: clipboard write refused, the text is left selected", err);
      ta.focus(); ta.select();
      toast(`자동 복사 불가 · ${/Mac|iPhone|iPad/.test(navigator.platform) ? "⌘C" : "Ctrl+C"} 로 복사`);
      setTimeout(() => ta.remove(), 15000);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(finish, byHand);
    else byHand(new Error("no clipboard API in this browser"));
  }
  /* Saving a file: inside the artifact viewer only the downloads capability can do it (a
     plain download link is inert there, so claiming "saved" would be false); as a plain
     file in a browser an ordinary download works. */
  const inViewer = !!(window.claude && typeof window.claude.use === "function");
  // shown inside another page's frame? (reading window.top can itself be refused there)
  const framed = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();
  const downloadsReady = inViewer
    ? window.claude.use("downloads").catch((e) => { console.warn("abcheck: downloads capability did not load", e); return null; })
    : Promise.resolve(null);
  function save(filename, data, mime) {
    downloadsReady.then((dl) => {
      if (dl) {
        return dl.save({ filename, data }).then(() => toast(filename + " 저장"), (e) => {
          const code = e && e.code;
          if (code === "declined") toast("저장 취소");
          else if (code === "rate_limited") toast("저장 창이 이미 열려 있음");
          else { console.error("abcheck: saving " + filename + " failed", e); copy(data, "파일 저장 불가 · 내용을 복사함"); }
        });
      }
      if (inViewer) return copy(data, "파일 저장 불가 · 내용을 복사함");
      const url = URL.createObjectURL(new Blob([data], { type: mime }));
      const a = document.createElement("a");
      a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
      // An ordinary download. Inside someone else's frame the browser may drop it without telling the
      // page, so there the toast says what was asked for and offers the content as a copy instead.
      if (framed) toast(filename + " 내려받기", "내용 복사", () => copy(data, filename + " 내용 복사"));
      else toast(filename + " 저장");
    });
  }
  /** Read pasted or loaded text. Pasted tables and JSON go through the engine's own readers. */
  function readText(text, fileName) {
    if (fileName) return ABCHECK.readInput(text, fileName);
    const kind = ABUI.pastedKind(text);
    if (!kind) return ABCHECK.readInput(text, "");
    return [ABCHECK.readInput(text, "pasted" + kind)[0], kind === ".json" ? "붙여넣은 JSON" : "붙여넣은 표"];
  }
  const pad = (n) => String(n).padStart(2, "0");
  const stamp = () => { const d = state.at || new Date(); return d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + "-" + pad(d.getHours()) + pad(d.getMinutes()); };
  const when = (d) => d ? `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}` : "";
  const whenShort = (d) => d ? `${d.getMonth() + 1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}` : "";

  /* ---------- rule sets ---------- */
  /** One toast for whatever storage could not give back (the readers below may each have something to say). */
  const notes = [];
  function note(msg) {
    if (!notes.length) setTimeout(() => { toast(notes.join(" · ")); notes.length = 0; }, 500);
    notes.push(msg);
  }
  function loadRules() {
    const got = ABUI.cleanRules(store.get(K.rules, null));
    state.rules.sets = got.sets; state.rules.active = got.active;
    if (got.dropped) {
      got.errors.forEach((m) => console.error("abcheck: a stored rule set was dropped: " + m));
      note(`저장된 규칙 세트 ${got.dropped}개를 읽지 못함`);
    }
  }
  /** Stored analyses, checked on every read. What does not have the expected shape is removed from storage and reported once. */
  let recentWarned = false;
  function recents() {
    const got = ABUI.cleanRecent(store.get(K.recent, null));
    if (got.dropped) {
      store.set(K.recent, got.list);
      if (!recentWarned) {
        recentWarned = true;
        console.error(`abcheck: ${got.dropped} stored analyses had an unexpected shape and were removed`);
        note(`저장된 분석 ${got.dropped}건을 읽지 못함`);
      }
    }
    return got.list;
  }
  const rules = () => state.rules.sets.find((s) => s.id === state.rules.active) || ABUI.DEFAULT_RULESET;
  const saveRules = () => store.set(K.rules, state.rules);
  const retriage = () => { if (state.payload) { state.rows = ABUI.buildRows(state.payload, rules()); state.pairs = ABUI.pairMap(state.rows); } };
  const meta = () => ({ ruleName: rules().name, when: when(state.at), pairs: state.pairs });

  /* ---------- analysis ---------- */
  function setBusy(msg) { $("busy").innerHTML = msg ? `<div class="busy" role="status"><div>${esc(msg)}</div></div>` : ""; }

  /** Analyse parsed entries; false when nothing passed validation (state.rejected holds why). */
  function analyzeEntries(entries, source, ph, opts) {
    const payload = ABCHECK.analyze(entries, ph);
    if (payload.sequences.every((s) => !s.input_ok)) { state.rejected = payload; return false; }
    state.payload = payload; state.source = source; state.ph = ph;
    state.at = opts.at ? new Date(opts.at) : new Date();
    state.isExample = !!opts.example; state.recentId = opts.recentId || null;
    state.picked = new Set(opts.picked || []);
    state.limit = PAGE; state.hero = 0; state.error = null; state.rejected = null;
    retriage();
    if (!opts.example && !opts.recentId) remember(entries, source, ph, opts.text || "");
    return true;
  }
  function run(work, count) {
    const start = () => { try { work(); } finally { setBusy(""); } };
    if (count > 300) { setBusy(`분석 중 · 서열 ${count}개`); setTimeout(start, 30); } else start();
  }
  /** Show a cause and the next step on the 새 분석 screen. */
  function fail(cause, next) {
    state.error = [cause, next];
    if (state.view === "new") render(); else go("new");
  }
  function finish(ok) {
    if (ok) {
      const t = ABUI.tally(state.rows);
      toast(`후보 ${t.all}건 분석${t.errors ? ` · 입력 오류 ${t.errors}` : ""}${unkept() ? " · 저장 안 됨" : ""}`);
      if (state.view === "all") render(); else go("all");
    } else if (state.view === "new") render(); else go("new");
  }
  function analyzeText(text, fileName, ph, opts) {
    state.error = null; state.rejected = null;
    if (!(opts && opts.example)) { state.input = text; state.fileName = fileName || ""; }
    if (!String(text).trim()) return fail("입력이 비어 있음", "서열 · FASTA 붙여넣기 또는 파일 열기");
    if (!(ph >= 0 && ph <= 14)) return fail("pH 값이 범위를 벗어남", "0–14 사이 숫자 입력");
    let entries, source;
    try { [entries, source] = readText(text, fileName); }
    catch (e) { return fail(e.message, "형식을 고친 뒤 다시 분석"); }
    if (!entries.length) return fail("읽은 서열이 없음", "FASTA 는 '>' 줄 아래에 서열 필요");
    run(() => finish(analyzeEntries(entries, source, ph, Object.assign({ text }, opts || {}))), entries.length);
  }
  function decode(buf) {
    const b = new Uint8Array(buf);
    if (b[0] === 0xef && b[1] === 0xbb && b[2] === 0xbf) return new TextDecoder("utf-8").decode(b.subarray(3));
    if (b[0] === 0xff && b[1] === 0xfe) return new TextDecoder("utf-16le").decode(b.subarray(2));
    if (b[0] === 0xfe && b[1] === 0xff) return new TextDecoder("utf-16be").decode(b.subarray(2));
    try { return new TextDecoder("utf-8", { fatal: true }).decode(b); } catch (e) { /* not UTF-8: try the Korean code page next */ }
    try { return new TextDecoder("euc-kr", { fatal: true }).decode(b); } catch (e) { /* neither: reported below */ }
    throw new Error("글자 인코딩을 알 수 없음");
  }
  /** Several files at once: each is parsed by its own name, then all are analysed together. */
  function analyzeFiles(fileList, ph) {
    const files = Array.from(fileList || []);
    if (!files.length) return;
    state.error = null; state.rejected = null;
    const xlsx = files.find((f) => /\.xlsx?$/i.test(f.name));
    if (xlsx) return fail(`${xlsx.name}: 엑셀 파일은 바로 읽지 않음`, "엑셀에서 'CSV UTF-8' 로 저장한 파일 열기");
    Promise.all(files.map((f) => f.arrayBuffer().then((buf) => ({ name: f.name, buf })))).then((loaded) => {
      const parts = [];
      let text = "";
      for (const f of loaded) {
        try {
          const t = decode(f.buf);
          const [entries, source] = ABCHECK.readInput(t, f.name);
          parts.push({ name: f.name, entries, source });
          if (loaded.length === 1) text = t;
        } catch (e) { return fail(`${f.name}: ${e.message}`, "파일을 고치거나 빼고 다시 열기"); }
      }
      const all = ABUI.combineEntries(parts);
      if (!all.entries.length) return fail("읽은 서열이 없음", "FASTA 는 '>' 줄 아래에 서열 필요");
      if (loaded.length === 1) { state.input = text; state.fileName = loaded[0].name; }
      run(() => finish(analyzeEntries(all.entries, all.source, ph, { text })), all.entries.length);
    }, (e) => { console.error("abcheck: reading the dropped files failed", e); fail("파일을 읽지 못함", "다시 끌어다 놓기"); });
  }

  /**
   * Keep this analysis in the browser. state.recentId stays null when it could not be kept (too
   * big, or storage refused the write); the screen then says "저장 안 됨". When storage is full,
   * older analyses make room first: the newest one is the one the user is looking at.
   */
  function remember(entries, source, ph, text) {
    const body = JSON.stringify(entries);
    state.recentId = null;
    if (body.length + text.length > 500000) return;      // too big for browser storage
    const list = recents().filter((r) => JSON.stringify(r.entries) !== body);
    const id = "r" + Date.now();
    list.unshift({ id, entries, source, ph, text, count: entries.length, at: Date.now(), picked: [] });
    for (let keep = Math.min(6, list.length); keep >= 1; keep--) {
      if (store.set(K.recent, list.slice(0, keep))) { state.recentId = id; return; }
    }
  }
  /** An analysis the user ran that is not in browser storage: it is gone after a reload. */
  const unkept = () => !!state.payload && !state.isExample && !state.recentId;
  function savePicked() {
    if (!state.recentId) return;
    const list = recents();
    const r = list.find((x) => x.id === state.recentId);
    if (r) { r.picked = Array.from(state.picked); store.set(K.recent, list); }
  }
  function openRecent(r) {
    run(() => finish(analyzeEntries(r.entries, r.source, r.ph, { recentId: r.id, picked: r.picked, at: r.at })), r.entries.length);
  }
  const recentText = (r) => r.text || r.entries.map((e) => ">" + e[0] + "\n" + e[1] + "\n").join("");

  /* ---------- shared pieces ---------- */
  const tag = (r) => r.inputOk ? `<span class="tag ${r.cats[0]}">${esc(r.status)}</span>` : `<span class="tag errors">입력 오류</span>`;
  const chainText = (r) => r.chain === "H" ? "VH" : r.chain === "L" ? "VL" : "–";
  const marked = (c, hits) => ABUI.markedCdr(c, hits).replace(/<u /g, '<u class="m" ');
  const seqObj = (r) => state.payload.sequences[r.index];
  const first = (s) => { const i = s.indexOf(". "); return i > 0 ? s.slice(0, i + 1) : s; };
  const confText = (r) => !r.inputOk ? "입력 오류" : !r.cdrs.length ? "CDR 주석 실패" : r.confident ? "신뢰 가능" : "신뢰 불가";
  const pickBtn = (r) => `<button class="pick" type="button" data-pick="${r.index}" aria-pressed="${state.picked.has(r.index)}" aria-label="${esc(r.id)} 고르기" title="한 장에 넣기">${icon("bookmark")}</button>`;

  function ruler(seq, cdrs, hits) {
    const at = new Array(seq.length + 2).fill(null), liab = new Array(seq.length + 2).fill(null);
    cdrs.forEach((c) => { for (let i = c.start; i <= c.end; i++) at[i] = c.name; });
    (hits || []).forEach((x) => { for (let i = x.start; i <= x.end; i++) liab[i] = (liab[i] ? liab[i] + " / " : "") + `${x.label} ${x.match} · ${x.risk}`; });
    const phone = window.innerWidth < 520;
    const width = phone ? 30 : 50;                     // phones: no sideways scrolling
    let out = "";
    for (let off = 0; off < seq.length; off += width) {
      let line = "", cur = null, curL = null, buf = "";
      const names = [];
      const flush = () => {
        if (!buf) return;
        let t = esc(buf);
        if (curL) t = `<u class="m" title="${esc(curL)}">${t}</u>`;
        line += cur ? `<span class="c" title="${esc(cur)}">${t}</span>` : t;
        buf = "";
      };
      for (let i = off; i < Math.min(off + width, seq.length); i++) {
        if (i > off && (i - off) % 10 === 0) { flush(); line += " "; }
        const n = at[i + 1], l = liab[i + 1];
        if (n !== cur || l !== curL) { flush(); cur = n; curL = l; }
        buf += seq[i];
        if (n && !names.includes(n)) names.push(n);
      }
      flush();
      const label = names.map((n) => (phone ? n.replace(/^CDR-/, "") : n)).join(" · ");
      out += `<span class="p">${String(off + 1).padStart(phone ? 3 : 4, " ")}${phone ? " " : "  "}</span>${line}${label ? `  <span class="l">${esc(label)}</span>` : ""}\n`;
    }
    return out;
  }

  /* ---------- home: hero, title, stats, filters, cards ---------- */
  function heroSlides(t) {
    const d = ABUI.describeRuleSet(rules());
    const slides = [{
      badge: "선별 결과", title: `검토 필요 후보 ${t.review}개`, why: d[0] + " / " + d[1],
      btn: t.review ? ["목록 보기", "review"] : ["규칙 보기", "rules"]
    }];
    if (t.unknown) slides.push({ badge: "확인 필요", title: `판정 불가 ${t.unknown}개`, why: "주석 신뢰 불가 또는 CDR 주석 실패 · ANARCI/IMGT 로 경계 확인", btn: ["목록 보기", "unknown"] });
    if (t.errors) {
      const e = state.rows.find((r) => !r.inputOk);
      slides.push({ badge: "입력 오류", title: `입력 오류 ${t.errors}개`, why: `${e.id}: ${first(e.errors[0] || "")}`, btn: ["목록 보기", "errors"] });
    }
    return slides;
  }
  function hero(t) {
    if (!state.payload) {
      return `<section class="card hero" aria-label="새 분석">
        <div class="wide"><span class="badge">새 분석</span><h2>서열 붙여넣기</h2></div>
        <textarea id="hero-input" class="wide" spellcheck="false" autocomplete="off" aria-label="서열 · FASTA" placeholder=">후보-1&#10;QVQLVQSGAEVKKPGASVKVSCKAS..."></textarea>
        <div class="row wide">
          <button class="btn primary" type="button" id="hero-run">분석</button>
          <label class="btn filebtn" for="hero-file">파일 열기<input id="hero-file" type="file" multiple accept=".fasta,.fa,.faa,.fas,.txt,.csv,.tsv,.json"></label>
          <button class="btn" type="button" id="hero-example">예시</button>
        </div></section>`;
    }
    const slides = heroSlides(t);
    const i = Math.min(state.hero, slides.length - 1), s = slides[i];
    const nav = slides.length > 1 ? `<div class="hnav">
        <button class="iconbtn" type="button" id="hero-prev" aria-label="이전">${icon("left", 16)}</button>
        <button class="iconbtn" type="button" id="hero-next" aria-label="다음">${icon("right", 16)}</button>
        <span class="dots" aria-hidden="true">${slides.map((_, k) => `<i class="${k === i ? "on" : ""}"></i>`).join("")}</span>
        <span class="num">${i + 1}/${slides.length}</span></div>` : "";
    return `<section class="card hero" aria-label="먼저 볼 것">
      <div style="min-width:0"><span class="badge">${s.badge}</span>
        <h2>${esc(s.title)}</h2>
        <p class="why" title="${esc(s.why)}">${esc(s.why)}</p>
        <div class="meta"><a class="chip" href="#rules">규칙 ${esc(rules().name)}</a><span>후보 ${t.all}</span><span>·</span><span>${esc(state.source)}</span><span>·</span><span class="num">${whenShort(state.at)}</span>
          ${state.isExample ? `<span class="chip">예시 데이터</span><button class="chip" type="button" id="hero-clear">비우기</button>` : ""}${unkept() ? `<span class="chip" title="브라우저에 남지 않음 · 새로 고치면 사라짐">저장 안 됨</span>` : ""}</div></div>
      <a class="btn primary big" href="#${s.btn[1]}">${s.btn[0]} ${icon("arrow")}</a>
      ${nav}</section>`;
  }

  /** The numbers line of one chain: motif counts by region, Cys flag, pI, length. */
  function stateLineOf(r) {
    if (!r.inputOk) return "분석 안 함";
    const cnt = (c) => { const x = ABUI.countText(c); return x === "-" ? "없음" : x; };
    const parts = [];
    if (!r.regionsUnassigned) parts.push("CDR " + cnt(r.cdrCounts));
    parts.push((r.regionsUnassigned ? "모티프 " : "FR ") + cnt(r.fwCounts));
    if (r.flags.length) parts.push("비결합 Cys");
    parts.push("pI " + fmt(r.pI, 2), r.length + " aa");
    return parts.join(" · ");
  }

  const sortSelect = (cls) => `<label class="sr" for="f-sort">정렬</label><select id="f-sort" class="${cls}">` +
    [["input", "입력 순"], ["name", "이름 순"], ["pi-desc", "pI 높은 순"], ["pi-asc", "pI 낮은 순"]].map(([k, l]) => `<option value="${k}"${ui.sort === k ? " selected" : ""}>${l}</option>`).join("") + `</select>`;

  function candCard(r) {
    let title, sub = "";
    const stateLine = stateLineOf(r);
    const partner = state.rows[state.pairs[r.index]];
    if (!r.inputOk) {
      title = `<div class="ctitle why">${esc(first(r.errors[0] || ""))}</div>`;
    } else {
      // not confident: say why on the card itself (the engine's own first reason)
      const reasons = seqObj(r).annotation.reasons;
      const why = !r.confident && reasons.length ? first(reasons[0]) : "";
      title = r.cdr3
        ? `<div class="ctitle seq"><span class="k">${r.cdr3.name.slice(-2)}</span>${marked(r.cdr3, r.hits)}</div>`
        : `<div class="ctitle why">${esc(why || "CDR 주석 실패")}</div>`;
      if (r.cdr3) {
        sub = why ? `<div class="csub" title="${esc(why)}">${esc(why)}</div>`
          : `<div class="csub seq">${r.cdrs.slice(0, 2).map((c) => esc(c.name.slice(-2)) + " " + marked(c, r.hits)).join(" · ")}</div>`;
      }
    }
    return `<article class="card cand" data-i="${r.index}">
      <div class="chead"><span class="chain">${chainText(r)}</span><button class="cname" type="button" data-open="${r.index}">${esc(r.id)}</button>${r.inputOk ? pickBtn(r) : ""}</div>
      ${title}${sub}
      <div class="cstate" title="${esc(stateLine)}">${esc(stateLine)}</div>
      <div class="cfoot">${tag(r)}<span class="row s13">${partner ? `<button class="chip" type="button" data-open="${partner.index}" title="${esc(partner.id)}">짝 ${chainText(partner)}</button>` : ""}<span>${r.inputOk ? (r.confident ? "신뢰 가능" : "신뢰 불가") : ""}</span></span></div>
    </article>`;
  }

  /** One antibody = its two chains on one card. Each chain keeps its own tag: nothing is merged. */
  function abCard(u) {
    const block = (r) => {
      const reasons = seqObj(r).annotation.reasons;
      const why = !r.confident && reasons.length ? first(reasons[0]) : "";
      const body = r.cdr3 ? `<span class="k">${r.cdr3.name.slice(-2)}</span>${marked(r.cdr3, r.hits)}` : esc(why || "CDR 주석 실패");
      const under = r.cdr3 && why ? why : stateLineOf(r);
      return `<button class="abrow" type="button" data-open="${r.index}" aria-label="${esc(r.id)} 상세">
        <span class="abtop"><span class="chain">${chainText(r)}</span><span class="abseq${r.cdr3 ? " seq" : ""}">${body}</span>${tag(r)}</span>
        <span class="cstate" title="${esc(under)}">${esc(under)}</span></button>`;
    };
    const both = state.picked.has(u.h.index) && state.picked.has(u.l.index);
    return `<article class="card cand ab">
      <div class="chead"><span class="chain">VH+VL</span><span class="cname">${esc(u.name)}</span>
        <button class="pick" type="button" data-pick-pair="${u.h.index},${u.l.index}" aria-pressed="${both}" aria-label="${esc(u.name)} 두 체인 고르기" title="한 장에 넣기">${icon("bookmark")}</button></div>
      ${block(u.h)}${block(u.l)}
    </article>`;
  }

  function viewHome(view) {
    const t = ABUI.tally(state.rows, state.picked);
    if (!state.payload) return hero(t) + `<div class="blank"><span>분석한 후보 없음</span></div>`;
    const hasPairs = Object.keys(state.pairs).length > 0;
    const unit = unitNow();
    const abMode = hasPairs && unit === "ab";          // an antibody has both chains: the chain filter does not apply
    const shown = ABUI.sortRows(ABUI.filterRows(state.rows, { view, chain: abMode ? "all" : ui.chain, conf: ui.conf, query: state.query, picked: state.picked }), ui.sort);
    const cur = (v) => (view === v ? ' aria-current="true"' : "");
    const opt = (list, val) => list.map(([k, l]) => `<option value="${k}"${val === k ? " selected" : ""}>${l}</option>`).join("");
    let h = view === "all" && !state.query ? hero(t) : "";
    const units = abMode ? ABUI.antibodyUnits(shown, state.rows, state.pairs) : null;
    state.openList = units ? units.flatMap((u) => (u.h ? [u.h, u.l] : [u.row])) : shown;
    const nPairs = units ? units.filter((u) => u.h).length : 0;
    const count = units ? `항체 ${nPairs}쌍${units.length > nPairs ? ` · 단독 ${units.length - nPairs}건` : ""}` : `${shown.length}건`;
    h += `<div class="titlebar"><h1>${LISTS[view]}</h1><span class="cnt num">${count}</span>
        <div class="row"><button class="btn" type="button" id="x-tsv">Excel용 복사</button><button class="btn" type="button" id="x-mail">메일용 복사</button>
          <button class="btn" type="button" id="x-fasta" title="ANARCI · IMGT 에 붙여넣기용">FASTA 복사</button>
          <button class="btn" type="button" id="x-csv">CSV</button><button class="btn" type="button" id="x-json">JSON</button></div></div>
      <div class="stats">
        <a class="stat" href="#all"${cur("all")}>후보<b>${t.all}</b></a>
        <a class="stat" href="#review"${cur("review")}>검토 필요<b>${t.review}</b></a>
        <a class="stat" href="#unknown"${cur("unknown")}>판정 불가<b>${t.unknown}</b></a>
        <a class="stat" href="#errors"${cur("errors")}>입력 오류<b>${t.errors}</b></a>
        <a class="stat" href="#picked"${cur("picked")}>고른 후보<b>${t.picked}</b></a>
        <span class="spacer s13 muted num">${when(state.at)} 분석</span>
      </div>
      <div class="row">
        ${abMode ? "" : `<label class="sr" for="f-chain">체인</label><select id="f-chain">${opt([["all", "체인 전체"], ["H", "VH"], ["L", "VL"]], ui.chain)}</select>`}
        <label class="sr" for="f-conf">주석</label><select id="f-conf">${opt([["all", "주석 전체"], ["yes", "신뢰 가능"], ["no", "신뢰 불가"]], ui.conf)}</select>
        <div class="seg" role="group" aria-label="분류">
          ${[["all", "전체", t.all], ["review", "검토 필요", t.review], ["unknown", "판정 불가", t.unknown], ["clear", "기준 해당 없음", t.clear]].map(([k, l, n]) =>
            `<a href="#${k}"${cur(k)}>${l} <b>${n}</b></a>`).join("")}
        </div>
        ${hasPairs ? `<div class="seg" role="group" aria-label="단위">${[["seq", "서열"], ["ab", "항체"]].map(([k, l]) => `<button type="button" data-unit="${k}" aria-pressed="${unit === k}">${l}</button>`).join("")}</div>` : ""}
        ${sortSelect("spacer")}
      </div>`;
    if (!shown.length) {
      const filtered = state.query || (!abMode && ui.chain !== "all") || ui.conf !== "all";
      const msg = view === "picked" && !filtered ? "고른 후보 없음 · 카드의 북마크로 고르기" : filtered ? "조건에 맞는 후보 없음" : `${LISTS[view]} 후보 없음`;
      h += `<div class="blank"><span>${msg}</span>${filtered ? `<button class="btn" type="button" id="f-reset">필터 지우기</button>` : ""}</div>`;
    } else {
      const cards = units ? units.map((u) => (u.h ? abCard(u) : candCard(u.row))) : shown.map(candCard);
      h += `<div class="grid">${cards.slice(0, state.limit).join("")}</div>`;
      if (cards.length > state.limit) h += `<div class="row"><button class="btn" type="button" id="more">${cards.length - state.limit}건 더 보기</button></div>`;
    }
    return h;
  }

  /* ---------- detail drawer ---------- */
  function sheetBody(r) {
    const s = seqObj(r);
    if (!s.input_ok) return `<div class="blk"><h3>고칠 것</h3><ul>${s.errors.map((e) => `<li>${esc(e)}</li>`).join("")}</ul></div>`;
    const a = s.annotation, L = s.liabilities, P = Object.values(s.properties || {});
    let h = "";
    if (r.reasons.length || r.note) h += `<div class="blk"><h3>${r.reasons.length ? "규칙 해당 · " + esc(rules().name) : "분류 근거"}</h3><ul>${r.reasons.map((x) => `<li>${esc(x)}</li>`).join("")}${r.note ? `<li>${esc(r.note)}</li>` : ""}</ul></div>`;
    const memos = [...a.reasons.map((x) => ["신뢰 불가 사유", x]), ...a.warnings.map((x) => ["주의", x]), ...s.warnings.map((x) => ["참고", x])];
    if (memos.length) h += `<div class="blk"><h3>주석 메모</h3><ul>${memos.map(([k, x]) => `<li><b>${k}</b> · ${esc(x)}</li>`).join("")}</ul></div>`;
    if (r.cdrs.length) {
      h += `<div class="blk"><h3>CDR · 1-based</h3><div class="scroll"><table><thead><tr><th>CDR</th><th class="num">위치</th><th class="num">길이</th><th>서열</th></tr></thead><tbody>` +
        r.cdrs.map((c) => `<tr><td class="nw">${esc(c.name)}</td><td class="num">${c.start}-${c.end}</td><td class="num">${c.length}</td><td class="seqcell">${marked(c, L.hits)}</td></tr>`).join("") +
        `</tbody></table></div></div>`;
    }
    h += `<div class="blk"><h3>서열</h3><p class="legend"><span><span class="c">ABC</span> CDR</span><span><u class="m">NG</u> 모티프</span></p>
      <div class="scroll"><pre class="ruler">${ruler(s.sequence, r.cdrs, L.hits)}</pre></div></div>`;
    h += `<div class="blk"><h3>liability</h3>`;
    if (L.domain_flags.length) h += `<ul>${L.domain_flags.map((f) => `<li><b>${esc(f.label)} · ${esc(f.risk)}</b><span class="why2">${esc(f.rationale)}</span></li>`).join("")}</ul>`;
    h += L.hits.length
      ? `<div class="scroll"><table><thead><tr><th>위험도</th><th>항목</th><th class="num">위치</th><th>구간</th></tr></thead><tbody>` +
        L.hits.map((x) => `<tr><td class="nw"><b>${esc(x.risk)}</b></td><td>${esc(x.label)} <span class="mono">${esc(x.match)}</span><span class="why2">${esc(x.risk_note)}</span></td><td class="num">${x.start === x.end ? x.start : x.start + "-" + x.end}</td><td class="nw">${esc(x.region)}</td></tr>`).join("") +
        `</tbody></table></div>` +
        // each rationale once, not once per row
        `<ul class="s13 muted">${L.hits.filter((x, i, a) => a.findIndex((y) => y.label === x.label) === i).map((x) => `<li>${esc(x.label)} — ${esc(x.rationale)}</li>`).join("")}</ul>`
      : `<p class="muted">검출된 모티프 없음</p>`;
    L.warnings.forEach((w) => { h += `<p class="s13 muted">${esc(w)}</p>`; });
    h += `</div>`;
    if (P.length) {
      h += `<div class="blk"><h3>물성 · pH ${esc(P[0].pH)}</h3><div class="scroll"><table><thead><tr><th>구간</th><th class="num">길이</th><th class="num">pI</th><th class="num">GRAVY</th><th class="num">net charge</th></tr></thead><tbody>` +
        P.map((x) => `<tr><td class="nw">${esc(x.label)}</td><td class="num">${x.length}</td><td class="num">${fmt(x.pI, 2)}</td><td class="num">${fmt(x.GRAVY, 3)}</td><td class="num">${signed(x.net_charge)}</td></tr>`).join("") +
        `</tbody></table></div></div>`;
    }
    return h;
  }
  function openSheet(index, opener) {
    const r = state.rows[index];
    if (!r) return;
    state.open = index;
    if (opener) state.opener = opener;
    const list = state.openList.length ? state.openList : state.rows;
    const pos = list.findIndex((x) => x.index === index);
    $("sheet-chain").textContent = chainText(r);
    $("sheet-title").textContent = r.id;
    const partner = state.rows[state.pairs[index]];
    $("sheet-sub").innerHTML = `${tag(r)}<span class="s13 muted">${r.inputOk ? `${confText(r)} · ${r.length} aa` : "분석 안 함"}</span>` +
      (partner ? `<button class="chip" type="button" id="sheet-partner">짝 ${esc(partner.id)}</button>` : "");
    if (partner) $("sheet-partner").addEventListener("click", () => openSheet(partner.index));
    $("sheet-pick").hidden = !r.inputOk;
    $("sheet-pick").setAttribute("aria-pressed", String(state.picked.has(index)));
    $("sheet-body").innerHTML = sheetBody(r);
    $("sheet-body").scrollTop = 0;
    $("sheet-pos").textContent = pos >= 0 ? `${pos + 1} / ${list.length}` : "";
    $("sheet-prev").disabled = pos <= 0;
    $("sheet-next").disabled = pos < 0 || pos >= list.length - 1;
    $("sheet-copy").disabled = !r.inputOk;
    const sheet = $("sheet");
    if (!sheet.classList.contains("on")) {
      sheet.classList.add("on"); sheet.setAttribute("aria-hidden", "false"); $("scrim").classList.add("on");
      $("sheet-close").focus();
    }
  }
  function closeSheet() {
    const sheet = $("sheet");
    if (!sheet.classList.contains("on")) return;
    sheet.classList.remove("on"); sheet.setAttribute("aria-hidden", "true");
    if (!$("side").classList.contains("on")) $("scrim").classList.remove("on");
    state.open = null;
    if (state.opener && document.contains(state.opener)) state.opener.focus();
    state.opener = null;
  }
  function stepSheet(d) {
    const list = state.openList.length ? state.openList : state.rows;
    const next = list[list.findIndex((x) => x.index === state.open) + d];
    if (next) openSheet(next.index);
  }
  function togglePick(index) {
    if (state.picked.has(index)) state.picked.delete(index); else state.picked.add(index);
    savePicked();
    if (state.open === index) $("sheet-pick").setAttribute("aria-pressed", String(state.picked.has(index)));
    refreshPicks();
  }
  /** Bookmark of an antibody card: both chains in, or both out. */
  function togglePair(h, l) {
    const both = state.picked.has(h) && state.picked.has(l);
    [h, l].forEach((i) => { if (both) state.picked.delete(i); else state.picked.add(i); });
    savePicked();
    refreshPicks();
  }
  function refreshPicks() {
    document.querySelectorAll("[data-pick]").forEach((b) => b.setAttribute("aria-pressed", String(state.picked.has(Number(b.dataset.pick)))));
    document.querySelectorAll("[data-pick-pair]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.pickPair.split(",").every((i) => state.picked.has(Number(i))))));
    renderSidebar();
    if (state.view === "picked" || state.view === "onepage") render();
    else { const b = document.querySelector('.stat[href="#picked"] b'); if (b) b.textContent = state.picked.size; }
  }

  /* ---------- other screens ---------- */
  function recentRows() {
    const list = recents();
    if (!list.length) return "";
    return `<section class="card"><div class="scroll"><table><thead><tr><th>최근 입력</th><th class="num wide-only">서열</th><th class="num wide-only">시각</th><th></th></tr></thead><tbody>` +
      list.map((r, i) => `<tr><td>${esc(r.source)}<span class="s13 muted only-narrow">${r.count}건 · ${whenShort(new Date(r.at))}</span></td><td class="num wide-only">${r.count}</td><td class="nw num wide-only">${whenShort(new Date(r.at))}</td>
        <td class="num nw"><button class="btn" type="button" data-load="${i}">불러오기</button> <button class="btn" type="button" data-forget="${i}" aria-label="${esc(r.source)} 삭제">삭제</button></td></tr>`).join("") +
      `</tbody></table></div></section>`;
  }
  function viewNew() {
    let err = "";
    if (state.error) err = `<div class="err" role="alert"><b>${esc(state.error[0])}</b><span>${esc(state.error[1])}</span></div>`;
    else if (state.rejected) {
      // numbers or a closing "*" that came with the copy: one click removes them (never done silently)
      const strip = /\.(csv|tsv|json)$/i.test(state.fileName) ? null : ABUI.stripNumbering(state.input);
      const what = strip ? [strip.digits ? `숫자 ${strip.digits}자` : "", strip.stops ? `끝의 * ${strip.stops}개` : ""].filter(Boolean).join(" · ") : "";
      err = `<div class="err" role="alert"><b>분석 가능한 서열 없음</b>` +
        state.rejected.sequences.slice(0, 8).map((s) => `<span><span class="mono">${esc(s.id)}</span> · ${esc(first(s.errors[0] || ""))}</span>`).join("") +
        (what ? `<span><button class="btn" type="button" id="strip">${what} 지우고 분석</button></span>` : `<span>고친 뒤 다시 분석</span>`) + `</div>`;
    }
    return `<div class="titlebar"><h1>새 분석</h1></div>
      <section class="card" style="display:grid;gap:12px">
        <label class="sr" for="input">서열 · FASTA · 표 · JSON</label>
        <textarea id="input" spellcheck="false" autocomplete="off" aria-invalid="${err ? "true" : "false"}" placeholder=">후보-1&#10;QVQLVQSGAEVKKPGASVKVSCKAS...&#10;>후보-2&#10;DIQMTQSPSSLSASVGDRVTITC...&#10;&#10;FASTA · CSV · TSV · JSON 파일 여러 개 끌어다 놓기">${esc(state.input)}</textarea>
        <div class="row">

  /** pI x GRAVY scatter, drawn at the width it is shown at so text keeps its size on a phone. */
  function scatter(rows, width) {
    const W = Math.round(Math.min(1100, Math.max(280, width))), small = W < 520;
    const H = small ? Math.round(W * 0.85) : 420, m = small ? { l: 46, r: 12, t: 12, b: 42 } : { l: 58, r: 26, t: 16, b: 46 };
    const xs = rows.map((r) => r.pI), ys = rows.map((r) => r.gravy);
    const xt = ABUI.niceTicks(Math.min(...xs) - 0.3, Math.max(...xs) + 0.3, small ? 4 : 7);
    const yt = ABUI.niceTicks(Math.min(...ys) - 0.1, Math.max(...ys) + 0.1, small ? 5 : 6);
    const X = (v) => m.l + (v - xt.lo) / (xt.hi - xt.lo) * (W - m.l - m.r);
    const Y = (v) => H - m.b - (v - yt.lo) / (yt.hi - yt.lo) * (H - m.t - m.b);
    // names only where they fit: outliers first, never on top of a point or another name
    const names = {};
    ABUI.placeLabels(rows.map((r) => ({ x: X(r.pI), y: Y(r.gravy), text: r.id })),
      { charW: 7.9, h: 16, gap: 10, r: 8, left: m.l, right: W - 2, top: m.t, bottom: H - m.b }).forEach((b) => { names[b.i] = b; });
    const nameText = (b, id) => {
      const beside = b.side === "right" || b.side === "left";
      return `<text class="lab" x="${beside ? (b.side === "right" ? b.x0 : b.x1) : (b.x0 + b.x1) / 2}" y="${(b.y0 + b.y1) / 2 + 4}" text-anchor="${b.side === "right" ? "start" : b.side === "left" ? "end" : "middle"}">${esc(id)}</text>`;
    };
    let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="pI × GRAVY 산점도 · 서열 ${rows.length}개">`;
    s += `<g class="gl">` + xt.ticks.map((v) => `<line x1="${X(v)}" x2="${X(v)}" y1="${m.t}" y2="${H - m.b}"/>`).join("") +
      yt.ticks.map((v) => `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(v)}" y2="${Y(v)}"/>`).join("") + `</g>`;
    s += xt.ticks.map((v) => `<text x="${X(v)}" y="${H - m.b + 18}" text-anchor="middle">${v}</text>`).join("");
    s += yt.ticks.map((v) => `<text x="${m.l - 8}" y="${Y(v) + 4}" text-anchor="end">${v}</text>`).join("");
    s += `<text x="${(m.l + W - m.r) / 2}" y="${H - 8}" text-anchor="middle">pI</text>`;
    s += `<text transform="translate(14 ${(m.t + H - m.b) / 2}) rotate(-90)" text-anchor="middle">GRAVY</text>`;
    s += rows.map((r, i) => {
      const x = X(r.pI), y = Y(r.gravy);
      const mark = r.chain === "L" ? `<rect class="ml" x="${x - 5}" y="${y - 5}" width="10" height="10" rx="1.5"/>` : `<circle class="mh" cx="${x}" cy="${y}" r="5.5"/>`;
      const lab = names[i] ? nameText(names[i], r.id) : "";
      return `<g class="pt" tabindex="0" role="button" data-open="${r.index}" data-x="${x}" data-y="${y}" aria-label="${esc(r.id)} · pI ${fmt(r.pI, 2)} · GRAVY ${fmt(r.gravy, 3)}">${mark}${lab}</g>`;
    }).join("");
    return s + `</svg>`;
  }
