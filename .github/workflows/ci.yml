name: CI

# Check pull requests into main and commits pushed directly to main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Cancel an in-flight run when a newer commit arrives on the same branch.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Cover the whole requires-python = ">=3.10" range from pyproject.toml.
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev dependencies
        # There are no runtime dependencies — standard library only.
        run: python -m pip install --upgrade pip pytest

      - name: Run tests
        run: python -m pytest -q

  deps:
    name: No runtime dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # tomllib needs 3.11+, so this runs once here rather than in the matrix.
          python-version: "3.13"

      - name: Fail if a runtime dependency slipped in
        run: |
          python - <<'PY'
          import tomllib, sys
          with open("pyproject.toml", "rb") as f:
              deps = tomllib.load(f)["project"].get("dependencies", [])
          if deps:
              sys.exit(f"Runtime dependencies were added: {deps}. This project is stdlib-only.")
          print("No runtime dependencies — OK")
          PY

  corpus:
    name: Synthetic corpus is reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Committed corpus matches generator output
        # Catches a generator change committed without regenerating the data.
        run: python scripts/make_synthetic_sequences.py --check

  cli:
    name: CLI smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: README example 1 — single sequence
        run: |
          SEQ=$(python -c "import json; print(json.load(open('data/synthetic/sequences.json'))['sequences'][0]['sequence'])")
          python -m abcheck.cli "$SEQ" > /dev/null

      - name: README example 2 — corpus to HTML report
        run: |
          python -m abcheck.cli data/synthetic/sequences.json --html --out-dir ci_output
          test -s ci_output/report.html

      - name: README example 3 — JSON output
        run: |
          mkdir -p ci_output
          python -m abcheck.cli data/synthetic/sequences.json --json > ci_output/report.json
          python -c "
          import json
          payload = json.load(open('ci_output/report.json'))
          assert payload['count'] == 24, payload['count']
          assert payload['limitations'], 'limitations notice is missing'
          assert payload['summary']['groups'], 'summary is missing'
          print('JSON output OK')
          "

      - name: Invalid input exits with code 1
        run: |
          if python -m abcheck.cli ACDEF > /dev/null 2>&1; then
            echo "Invalid input exited with success"
            exit 1
          fi
