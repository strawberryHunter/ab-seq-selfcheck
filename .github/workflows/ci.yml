name: CI

# Check pull requests into main and commits pushed directly to main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Cancel an in-flight run when a newer commit arrives on the same branch.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Cover the whole requires-python = ">=3.9" range from pyproject.toml.
        # 3.9 matters: it is the python3 that ships with macOS.
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev dependencies
        # There are no runtime dependencies — standard library only.
        run: python -m pip install --upgrade pip pytest

      - name: Run tests
        run: python -m pytest -q

  os:
    # Researchers run this on their own Windows and Mac machines, not on Linux.
    name: Works on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Run tests
        run: python -m pytest -q

      - name: Install, then run from another folder
        shell: bash
        run: |
          python -m pip install .
          cd "$RUNNER_TEMP"
          abcheck "$GITHUB_WORKSPACE/data/synthetic/sequences.json" --html --out-dir abcheck_out
          test -s abcheck_out/report.html
          abcheck "$GITHUB_WORKSPACE/data/synthetic/sequences.json" --json > result.json
          python -c "import json; assert json.load(open('result.json', encoding='utf-8'))['count'] == 24"

      - name: Run with the python3 that ships with macOS
        # What a Mac researcher has before installing anything (3.9 on current macOS).
        if: runner.os == 'macOS'
        run: |
          /usr/bin/python3 --version
          /usr/bin/python3 -m abcheck.cli data/synthetic/sequences.json --html --out-dir stock_python_out
          test -s stock_python_out/report.html

  deps:
    name: No runtime dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          # tomllib needs 3.11+, so this runs once here rather than in the matrix.
          python-version: "3.13"

      - name: Fail if a runtime dependency slipped in
        run: |
          python - <<'PY'
          import tomllib, sys
          with open("pyproject.toml", "rb") as f:
              deps = tomllib.load(f)["project"].get("dependencies", [])
          if deps:
              sys.exit(f"Runtime dependencies were added: {deps}. This project is stdlib-only.")
          print("No runtime dependencies — OK")
          PY

  corpus:
    name: Synthetic corpus is reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Committed corpus matches generator output
        # Catches a generator change committed without regenerating the data.
        run: python scripts/make_synthetic_sequences.py --check

  cli:
    name: CLI smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: README example 1 — single sequence
        run: |
          SEQ=$(python -c "import json; print(json.load(open('data/synthetic/sequences.json'))['sequences'][0]['sequence'])")
          python -m abcheck.cli "$SEQ" > /dev/null

      - name: README example 2 — corpus to HTML report
        run: |
          python -m abcheck.cli data/synthetic/sequences.json --html --out-dir ci_output
          test -s ci_output/report.html

      - name: README example 3 — JSON output
        run: |
          mkdir -p ci_output
          python -m abcheck.cli data/synthetic/sequences.json --json > ci_output/report.json
          python -c "
          import json
          payload = json.load(open('ci_output/report.json'))
          assert payload['count'] == 24, payload['count']
          assert payload['limitations'], 'limitations notice is missing'
          assert payload['summary']['groups'], 'summary is missing'
          print('JSON output OK')
          "

      - name: Invalid input exits with code 1
        run: |
          set +e
          python -m abcheck.cli ACDEF > /dev/null 2>&1
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "Invalid input exited with $code, expected 1"
            exit 1
          fi

      - name: Unreadable input exits with code 2
        run: |
          set +e
          python -m abcheck.cli no_such_file.fasta > /dev/null 2>&1
          code=$?
          set -e
          if [ "$code" -ne 2 ]; then
            echo "Missing input file exited with $code, expected 2"
            exit 1
          fi
