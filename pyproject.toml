[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ab-seq-selfcheck"
version = "0.1.0"
description = "항체 가변도메인 서열 셀프 점검 도구 (표준 라이브러리만 사용)"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
# `pip install .` once, then `abcheck 후보.fasta --html` works from any folder.
abcheck = "abcheck.cli:main"

[tool.setuptools]
packages = ["abcheck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
